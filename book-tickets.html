<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎫 Book Tickets - Africa Railways</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --navy: #0a0e1a;
            --gold: #FFB800;
            --cyan: #00D4FF;
            --white: #ffffff;
            --surface: #16203a;
            --green: #10b981;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--navy);
            color: var(--white);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, var(--surface) 0%, #1a2642 100%);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--gold) 0%, var(--cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .back-button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #333;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--gold);
        }
        
        .booking-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .card {
            background: var(--surface);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #333;
        }
        
        .card h2 {
            color: var(--gold);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }
        
        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
        }
        
        .swap-button {
            background: var(--gold);
            border: none;
            color: var(--navy);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            margin: 10px auto;
            display: block;
            width: 40px;
            height: 40px;
            transition: all 0.3s;
        }
        
        .swap-button:hover {
            transform: rotate(180deg);
        }
        
        .class-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        
        .class-option {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #333;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        
        .class-option:hover {
            border-color: var(--gold);
        }
        
        .class-option.selected {
            border-color: var(--gold);
            background: rgba(255, 184, 0, 0.1);
        }
        
        .class-option .price {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--gold);
            margin-top: 5px;
        }
        
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #333;
        }
        
        .summary-item:last-child {
            border-bottom: none;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--gold);
        }
        
        .book-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--gold) 0%, #ff9500 100%);
            color: var(--navy);
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        
        .book-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 184, 0, 0.4);
        }
        
        .book-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }
        
        .status-message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
        }
        
        .status-message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        
        .info-box {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        
        .payment-banner {
            background: linear-gradient(135deg, rgba(255, 184, 0, 0.15), rgba(0, 212, 255, 0.15));
            border: 2px solid var(--gold);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .payment-banner h3 {
            color: var(--gold);
            margin-bottom: 10px;
            font-size: 1.3rem;
        }
        
        .payment-banner p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.6;
        }
        
        .payment-banner strong {
            color: var(--cyan);
        }
        
        @media (max-width: 768px) {
            .booking-grid {
                grid-template-columns: 1fr;
            }
            
            .class-options {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Exchange rates (USD to local currency) - fallback values
        const FALLBACK_RATES = {
            ZMW: 27.50,  // Zambian Kwacha
            TZS: 2580.00, // Tanzanian Shilling
            KES: 129.00,  // Kenyan Shilling
            ZAR: 18.75,   // South African Rand
            UGX: 3750.00, // Ugandan Shilling
            NGN: 1550.00, // Nigerian Naira
            USD: 1.00,
        };

        // Currency symbols
        const CURRENCY_SYMBOLS = {
            ZMW: 'ZK',
            TZS: 'TSh',
            KES: 'KSh',
            ZAR: 'R',
            UGX: 'USh',
            NGN: '₦',
            USD: '$',
        };

        // Currency names
        const CURRENCY_NAMES = {
            ZMW: 'Zambian Kwacha',
            TZS: 'Tanzanian Shilling',
            KES: 'Kenyan Shilling',
            ZAR: 'South African Rand',
            UGX: 'Ugandan Shilling',
            NGN: 'Nigerian Naira',
            USD: 'US Dollar',
        };

        // Base prices in USD
        const BASE_PRICES = {
            economy: 50,
            business: 120,
            first: 200,
        };

        const CLASSES = [
            { id: 'economy', name: 'Economy', priceUSD: 50, icon: '💺' },
            { id: 'business', name: 'Business', priceUSD: 120, icon: '🛋️' },
            { id: 'first', name: 'First Class', priceUSD: 200, icon: '👑' },
        ];

        // Simple Search Station Selector Component (API-based for performance)
        function SimpleStationSelector({ label, value, onChange, otherValue, stationData }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [isOpen, setIsOpen] = useState(false);
            const [highlightedIndex, setHighlightedIndex] = useState(0);
            const [filteredStations, setFilteredStations] = useState([]);
            const [selectedStation, setSelectedStation] = useState(null);
            const [isSearching, setIsSearching] = useState(false);

            // Load stations data for local search
            const [localStations, setLocalStations] = useState([]);
            
            useEffect(() => {
                fetch('/data/stations.json')
                    .then(res => res.json())
                    .then(data => {
                        // Flatten stations for search
                        const flat = [];
                        for (const country of data.countries || []) {
                            for (const city of country.cities || []) {
                                for (const station of city.stations || []) {
                                    flat.push({
                                        ...station,
                                        city: city.name,
                                        country: country.name,
                                    });
                                }
                            }
                        }
                        setLocalStations(flat);
                        console.log(`Loaded ${flat.length} stations for search`);
                    })
                    .catch(err => console.error('Failed to load stations:', err));
            }, []);

            // Debounced search
            useEffect(() => {
                if (!searchTerm || searchTerm.length < 2) {
                    setFilteredStations([]);
                    return;
                }

                setIsSearching(true);
                const timeoutId = setTimeout(() => {
                    // Search local stations
                    const term = searchTerm.toLowerCase();
                    const results = localStations
                        .filter(s => {
                            const searchText = `${s.name} ${s.city} ${s.country}`.toLowerCase();
                            return searchText.includes(term) && s.id !== otherValue;
                        })
                        .slice(0, 20);
                    
                    setFilteredStations(results);
                    setIsSearching(false);
                }, 300); // 300ms debounce

                return () => clearTimeout(timeoutId);
            }, [searchTerm, otherValue, localStations]);

            // Load selected station details from local data
            useEffect(() => {
                if (!value) {
                    setSelectedStation(null);
                    return;
                }

                const found = localStations.find(s => s.id === value);
                if (found) {
                    setSelectedStation(found);
                }
            }, [value, localStations]);

            const handleSelect = (station) => {
                onChange(station.id);
                setSearchTerm('');
                setIsOpen(false);
            };

            const handleKeyDown = (e) => {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    setHighlightedIndex(i => Math.min(i + 1, filteredStations.length - 1));
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    setHighlightedIndex(i => Math.max(i - 1, 0));
                } else if (e.key === 'Enter' && filteredStations[highlightedIndex]) {
                    e.preventDefault();
                    handleSelect(filteredStations[highlightedIndex]);
                } else if (e.key === 'Escape') {
                    setIsOpen(false);
                }
            };

            return (
                <div className="station-selector" style={{ position: 'relative' }}>
                    <label style={{ display: 'block', marginBottom: '8px', color: '#94a3b8', fontSize: '0.9rem', fontWeight: '600' }}>
                        {label}
                    </label>
                    
                    <input
                        type="text"
                        placeholder="Type to search stations..."
                        value={searchTerm}
                        onChange={(e) => {
                            setSearchTerm(e.target.value);
                            setIsOpen(true);
                            setHighlightedIndex(0);
                        }}
                        onFocus={() => setIsOpen(true)}
                        onBlur={() => setTimeout(() => setIsOpen(false), 200)}
                        onKeyDown={handleKeyDown}
                        style={{ 
                            width: '100%', 
                            padding: '12px', 
                            background: 'rgba(255,255,255,0.05)', 
                            border: selectedStation ? '1px solid var(--gold)' : '1px solid #333', 
                            borderRadius: '8px', 
                            color: 'white', 
                            fontSize: '1rem' 
                        }}
                    />

                    {/* Dropdown Results */}
                    {isOpen && filteredStations.length > 0 && (
                        <div style={{
                            position: 'absolute',
                            top: '100%',
                            left: 0,
                            right: 0,
                            background: '#1a2642',
                            border: '1px solid #333',
                            borderRadius: '8px',
                            marginTop: '4px',
                            maxHeight: '300px',
                            overflowY: 'auto',
                            zIndex: 100,
                            boxShadow: '0 10px 40px rgba(0,0,0,0.5)',
                        }}>
                            {filteredStations.map((station, index) => (
                                <div
                                    key={station.id}
                                    onClick={() => handleSelect(station)}
                                    style={{
                                        padding: '12px 15px',
                                        cursor: 'pointer',
                                        borderBottom: '1px solid #333',
                                        background: index === highlightedIndex ? 'rgba(255,184,0,0.1)' : 'transparent',
                                    }}
                                    onMouseEnter={() => setHighlightedIndex(index)}
                                >
                                    <div style={{ fontWeight: '600', color: 'white' }}>{station.name}</div>
                                    <div style={{ fontSize: '0.8rem', color: '#94a3b8' }}>
                                        {station.city}, {station.country}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Selected Station Display */}
                    {selectedStation && (
                        <div style={{ 
                            marginTop: '8px', 
                            padding: '10px 12px', 
                            background: 'rgba(255,184,0,0.1)', 
                            borderRadius: '6px',
                            display: 'flex',
                            justifyContent: 'space-between',
                            alignItems: 'center',
                        }}>
                            <div>
                                <span style={{ color: 'var(--gold)', fontWeight: '600' }}>📍 {selectedStation.name}</span>
                                <span style={{ color: '#94a3b8', marginLeft: '10px', fontSize: '0.85rem' }}>
                                    {selectedStation.city}, {selectedStation.country}
                                </span>
                            </div>
                            <button 
                                onClick={() => onChange('')}
                                style={{ 
                                    background: 'none', 
                                    border: 'none', 
                                    color: '#94a3b8', 
                                    cursor: 'pointer',
                                    fontSize: '1.2rem',
                                }}
                            >
                                ✕
                            </button>
                        </div>
                    )}

                    {searchTerm.length > 0 && searchTerm.length < 2 && (
                        <div style={{ marginTop: '8px', color: '#94a3b8', fontSize: '0.85rem' }}>
                            Type at least 2 characters to search...
                        </div>
                    )}

                    {isSearching && (
                        <div style={{ marginTop: '8px', color: '#94a3b8', fontSize: '0.85rem' }}>
                            Searching...
                        </div>
                    )}

                    {searchTerm.length >= 2 && !isSearching && filteredStations.length === 0 && (
                        <div style={{ marginTop: '8px', color: '#94a3b8', fontSize: '0.85rem' }}>
                            No stations found for "{searchTerm}"
                        </div>
                    )}
                </div>
            );
        }

        // Advanced Cascading Station Selector Component
        function AdvancedStationSelector({ label, value, onChange, otherValue, stationData }) {
            const [selectedCountry, setSelectedCountry] = useState('');
            const [selectedCity, setSelectedCity] = useState('');
            const [selectedStation, setSelectedStation] = useState('');
            const [searchTerm, setSearchTerm] = useState('');

            // Sync external value changes
            useEffect(() => {
                if (value && stationData) {
                    // Find station in data and set dropdowns
                    for (const country of stationData.countries) {
                        for (const city of country.cities) {
                            const station = city.stations.find(s => s.id === value);
                            if (station) {
                                setSelectedCountry(country.id);
                                setSelectedCity(city.id);
                                setSelectedStation(station.id);
                                return;
                            }
                        }
                    }
                }
            }, [value, stationData]);

            const handleCountryChange = (countryId) => {
                setSelectedCountry(countryId);
                setSelectedCity('');
                setSelectedStation('');
                onChange('');
            };

            const handleCityChange = (cityId) => {
                setSelectedCity(cityId);
                setSelectedStation('');
                onChange('');
            };

            const handleStationChange = (stationId) => {
                setSelectedStation(stationId);
                onChange(stationId);
            };

            // Get available options
            const countries = stationData?.countries || [];
            const cities = selectedCountry 
                ? countries.find(c => c.id === selectedCountry)?.cities || []
                : [];
            const stations = selectedCity
                ? cities.find(c => c.id === selectedCity)?.stations || []
                : [];

            // Filter stations if search term exists
            const filteredStations = searchTerm
                ? stations.filter(s => s.name.toLowerCase().includes(searchTerm.toLowerCase()))
                : stations;

            // Get selected station details
            const selectedStationData = stations.find(s => s.id === selectedStation);

            if (!stationData) {
                return (
                    <div className="form-group">
                        <label>{label}</label>
                        <div style={{ padding: '12px', background: 'rgba(255,255,255,0.05)', borderRadius: '8px', color: '#94a3b8' }}>
                            Loading stations...
                        </div>
                    </div>
                );
            }

            return (
                <div className="station-selector">
                    <label style={{ display: 'block', marginBottom: '8px', color: '#94a3b8', fontSize: '0.9rem', fontWeight: '600' }}>
                        {label}
                    </label>
                    
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '10px' }}>
                        {/* Country Dropdown */}
                        <select 
                            value={selectedCountry} 
                            onChange={(e) => handleCountryChange(e.target.value)}
                            style={{ padding: '10px', background: 'rgba(255,255,255,0.05)', border: '1px solid #333', borderRadius: '8px', color: 'white', fontSize: '0.9rem' }}
                        >
                            <option value="">Select Country</option>
                            {countries.map(country => (
                                <option key={country.id} value={country.id}>
                                    {country.name}
                                </option>
                            ))}
                        </select>

                        {/* City Dropdown */}
                        <select 
                            value={selectedCity} 
                            onChange={(e) => handleCityChange(e.target.value)}
                            disabled={!selectedCountry}
                            style={{ padding: '10px', background: 'rgba(255,255,255,0.05)', border: '1px solid #333', borderRadius: '8px', color: 'white', fontSize: '0.9rem', opacity: selectedCountry ? 1 : 0.5 }}
                        >
                            <option value="">Select City</option>
                            {cities.map(city => (
                                <option key={city.id} value={city.id}>
                                    {city.name} ({city.stations.length} stations)
                                </option>
                            ))}
                        </select>
                    </div>

                    {/* Station Dropdown with Search */}
                    {selectedCity && stations.length > 3 && (
                        <input
                            type="text"
                            placeholder="Search stations..."
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            style={{ width: '100%', padding: '8px 12px', background: 'rgba(255,255,255,0.05)', border: '1px solid #333', borderRadius: '8px', color: 'white', fontSize: '0.85rem', marginBottom: '10px' }}
                        />
                    )}

                    <select 
                        value={selectedStation} 
                        onChange={(e) => handleStationChange(e.target.value)}
                        disabled={!selectedCity}
                        style={{ width: '100%', padding: '12px', background: 'rgba(255,255,255,0.05)', border: selectedStation ? '1px solid var(--gold)' : '1px solid #333', borderRadius: '8px', color: 'white', fontSize: '1rem', opacity: selectedCity ? 1 : 0.5 }}
                    >
                        <option value="">Select Station</option>
                        {filteredStations.map(station => (
                            <option 
                                key={station.id} 
                                value={station.id}
                                disabled={station.id === otherValue}
                            >
                                {station.name} ({station.type})
                            </option>
                        ))}
                    </select>

                    {/* Selected Station Info */}
                    {selectedStationData && (
                        <div style={{ marginTop: '8px', padding: '8px 12px', background: 'rgba(255,184,0,0.1)', borderRadius: '6px', fontSize: '0.85rem' }}>
                            <span style={{ color: 'var(--gold)' }}>📍 {selectedStationData.name}</span>
                            <span style={{ color: '#94a3b8', marginLeft: '10px' }}>{selectedStationData.type}</span>
                        </div>
                    )}
                </div>
            );
        }

        function BookingApp() {
            const [stationData, setStationData] = useState(null);
            const [from, setFrom] = useState('');
            const [to, setTo] = useState('');
            const [date, setDate] = useState('');
            const [passengers, setPassengers] = useState(1);
            const [selectedClass, setSelectedClass] = useState('economy');
            const [status, setStatus] = useState('');
            const [isBooking, setIsBooking] = useState(false);
            const [searchMode, setSearchMode] = useState('simple'); // 'simple' or 'advanced'
            const [isReturnTrip, setIsReturnTrip] = useState(false);
            const [localCurrency, setLocalCurrency] = useState('TZS');
            const [exchangeRates, setExchangeRates] = useState(FALLBACK_RATES);
            const [rateSource, setRateSource] = useState('fallback');
            const [loadingRates, setLoadingRates] = useState(true);

            // Fetch live exchange rates
            useEffect(() => {
                const fetchRates = async () => {
                    try {
                        setLoadingRates(true);
                        const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                        if (response.ok) {
                            const data = await response.json();
                            const rates = {};
                            Object.keys(FALLBACK_RATES).forEach(currency => {
                                rates[currency] = data.rates[currency] || FALLBACK_RATES[currency];
                            });
                            setExchangeRates(rates);
                            setRateSource('live');
                        }
                    } catch (error) {
                        console.warn('Failed to fetch live rates, using fallback:', error);
                        setRateSource('fallback');
                    } finally {
                        setLoadingRates(false);
                    }
                };
                fetchRates();
            }, []);

            // Load station data only when needed (for advanced mode)
            useEffect(() => {
                // Only load full data if in advanced mode
                if (searchMode === 'advanced' && !stationData?.countries?.length) {
                    fetch('/data/stations.json')
                        .then(res => res.json())
                        .then(data => setStationData(data))
                        .catch(err => console.error('Failed to load stations:', err));
                } else if (!stationData) {
                    // Set minimal metadata for simple mode
                    setStationData({ 
                        metadata: { totalStations: 7258, totalCountries: 31 }, 
                        countries: [] 
                    });
                }
            }, [searchMode]);

            // Reset selections when switching modes
            const handleModeChange = (mode) => {
                setSearchMode(mode);
                setFrom('');
                setTo('');
            };

            // Calculate prices with return trip multiplier
            const tripMultiplier = isReturnTrip ? 2 : 1;
            const selectedClassData = CLASSES.find(c => c.id === selectedClass);
            const basePriceUSD = selectedClassData ? selectedClassData.priceUSD : 0;
            const totalPriceUSD = basePriceUSD * passengers * tripMultiplier;
            const totalPriceAFC = totalPriceUSD; // 1 AFC = 1 USD
            const totalPriceLocal = totalPriceUSD * (exchangeRates[localCurrency] || 1);
            
            // Format local currency
            const formatLocalPrice = (amount) => {
                const symbol = CURRENCY_SYMBOLS[localCurrency] || localCurrency;
                // No decimals for large value currencies
                if (['TZS', 'UGX', 'NGN'].includes(localCurrency)) {
                    return `${symbol}${Math.round(amount).toLocaleString()}`;
                }
                return `${symbol}${amount.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            };

            // Find station details for summary
            const findStation = (stationId) => {
                if (!stationData || !stationId) return null;
                for (const country of stationData.countries) {
                    for (const city of country.cities) {
                        const station = city.stations.find(s => s.id === stationId);
                        if (station) {
                            return { ...station, city: city.name, country: country.name };
                        }
                    }
                }
                return null;
            };

            const fromStation = findStation(from);
            const toStation = findStation(to);

            const swapStations = () => {
                const temp = from;
                setFrom(to);
                setTo(temp);
            };

            const handleBooking = async () => {
                if (!from || !to || !date) {
                    setStatus('error:Please fill in all fields');
                    return;
                }

                if (from === to) {
                    setStatus('error:Departure and arrival stations must be different');
                    return;
                }

                setIsBooking(true);
                setStatus('');

                try {
                    // Simulate booking process
                    await new Promise(resolve => setTimeout(resolve, 2000));

                    // In production, this would call the blockchain smart contract
                    const bookingRef = 'AFC-' + Math.random().toString(36).substring(2, 10).toUpperCase();
                    
                    setStatus(`success:✅ Booking confirmed! Reference: ${bookingRef}`);
                    
                    // Reset form after 3 seconds
                    setTimeout(() => {
                        setFrom('');
                        setTo('');
                        setDate('');
                        setPassengers(1);
                        setSelectedClass('economy');
                        setStatus('');
                    }, 5000);
                } catch (error) {
                    setStatus('error:❌ Booking failed. Please try again.');
                } finally {
                    setIsBooking(false);
                }
            };

            return (
                <div className="container">
                    <div className="header">
                        <div>
                            <h1>🎫 Book Train Tickets</h1>
                            <p style={{ color: '#94a3b8', marginTop: '5px' }}>
                                Travel across Africa with blockchain-verified tickets
                            </p>
                        </div>
                        <a href="/" className="back-button">
                            <i className="fas fa-arrow-left"></i>
                            Back to Home
                        </a>
                    </div>

                    <div className="payment-banner">
                        <h3>💳 Payment & Rewards</h3>
                        <p>
                            Pay with <strong>local currency ({CURRENCY_NAMES[localCurrency]})</strong>, <strong>AFC (Africoin stablecoin)</strong>, or <strong>USD</strong>. 
                            Multi-currency support for seamless cross-border travel across Africa.
                        </p>
                        <p style={{ marginTop: '10px', fontSize: '0.9rem' }}>
                            Earn <strong>AFRC rewards</strong> on every journey • Stake for 12% APY • Vote on governance
                        </p>
                        
                        {/* Currency Selector */}
                        <div style={{ marginTop: '15px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '10px' }}>
                            <span style={{ color: '#94a3b8', fontSize: '0.9rem' }}>Display prices in:</span>
                            <select 
                                value={localCurrency}
                                onChange={(e) => setLocalCurrency(e.target.value)}
                                style={{ 
                                    padding: '8px 12px', 
                                    background: 'rgba(255,255,255,0.1)', 
                                    border: '1px solid var(--gold)', 
                                    borderRadius: '6px', 
                                    color: 'white', 
                                    fontSize: '0.9rem',
                                    cursor: 'pointer'
                                }}
                            >
                                <option value="TZS">🇹🇿 TZS - Tanzanian Shilling</option>
                                <option value="ZMW">🇿🇲 ZMW - Zambian Kwacha</option>
                                <option value="KES">🇰🇪 KES - Kenyan Shilling</option>
                                <option value="ZAR">🇿🇦 ZAR - South African Rand</option>
                                <option value="UGX">🇺🇬 UGX - Ugandan Shilling</option>
                                <option value="NGN">🇳🇬 NGN - Nigerian Naira</option>
                            </select>
                            <span style={{ color: '#64748b', fontSize: '0.75rem' }}>
                                {rateSource === 'live' ? '🔄 Live rate' : '📊 Standard rate'}
                            </span>
                        </div>
                    </div>

                    <div className="booking-grid">
                        <div className="card">
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                                <h2 style={{ margin: 0 }}>Journey Details</h2>
                                
                                {/* Search Mode Toggle */}
                                <div style={{ display: 'flex', gap: '5px', background: 'rgba(255,255,255,0.05)', borderRadius: '8px', padding: '4px' }}>
                                    <button
                                        onClick={() => handleModeChange('simple')}
                                        style={{
                                            padding: '8px 16px',
                                            border: 'none',
                                            borderRadius: '6px',
                                            cursor: 'pointer',
                                            fontSize: '0.85rem',
                                            fontWeight: '600',
                                            background: searchMode === 'simple' ? 'var(--gold)' : 'transparent',
                                            color: searchMode === 'simple' ? 'var(--navy)' : '#94a3b8',
                                            transition: 'all 0.2s',
                                        }}
                                    >
                                        🔍 Simple
                                    </button>
                                    <button
                                        onClick={() => handleModeChange('advanced')}
                                        style={{
                                            padding: '8px 16px',
                                            border: 'none',
                                            borderRadius: '6px',
                                            cursor: 'pointer',
                                            fontSize: '0.85rem',
                                            fontWeight: '600',
                                            background: searchMode === 'advanced' ? 'var(--gold)' : 'transparent',
                                            color: searchMode === 'advanced' ? 'var(--navy)' : '#94a3b8',
                                            transition: 'all 0.2s',
                                        }}
                                    >
                                        🗂️ Advanced
                                    </button>
                                </div>
                            </div>

                            {/* Return Trip Toggle */}
                            <div style={{ 
                                marginBottom: '20px', 
                                padding: '15px', 
                                background: isReturnTrip ? 'rgba(255,184,0,0.1)' : 'rgba(255,255,255,0.05)', 
                                borderRadius: '10px',
                                border: isReturnTrip ? '2px solid var(--gold)' : '1px solid #333',
                                display: 'flex',
                                justifyContent: 'space-between',
                                alignItems: 'center',
                                transition: 'all 0.3s'
                            }}>
                                <div>
                                    <div style={{ fontWeight: '600', color: isReturnTrip ? 'var(--gold)' : 'white', marginBottom: '4px' }}>
                                        {isReturnTrip ? '⇄ Return Trip' : '→ One Way'}
                                    </div>
                                    <div style={{ fontSize: '0.85rem', color: '#94a3b8' }}>
                                        {isReturnTrip ? 'Round trip ticket included' : 'Single journey only'}
                                    </div>
                                </div>
                                <label style={{ 
                                    display: 'flex', 
                                    alignItems: 'center', 
                                    gap: '10px',
                                    cursor: 'pointer',
                                    padding: '8px 16px',
                                    background: isReturnTrip ? 'var(--gold)' : 'rgba(255,255,255,0.1)',
                                    borderRadius: '20px',
                                    transition: 'all 0.3s'
                                }}>
                                    <span style={{ 
                                        fontSize: '0.85rem', 
                                        fontWeight: '600',
                                        color: isReturnTrip ? 'var(--navy)' : '#94a3b8'
                                    }}>
                                        Return Trip
                                    </span>
                                    <input 
                                        type="checkbox"
                                        checked={isReturnTrip}
                                        onChange={(e) => setIsReturnTrip(e.target.checked)}
                                        style={{ 
                                            width: '18px', 
                                            height: '18px',
                                            accentColor: 'var(--gold)',
                                            cursor: 'pointer'
                                        }}
                                    />
                                </label>
                            </div>

                            {/* Station count info */}
                            {stationData?.metadata && (
                                <div style={{ marginBottom: '20px', padding: '10px 15px', background: 'rgba(0,212,255,0.1)', borderRadius: '8px', fontSize: '0.85rem', color: '#94a3b8' }}>
                                    📊 {stationData.metadata.totalStations?.toLocaleString() || '7,258'} stations across {stationData.metadata.totalCountries || 31} countries
                                </div>
                            )}
                            
                            {searchMode === 'simple' ? (
                                <>
                                    <SimpleStationSelector 
                                        label="From (Departure)" 
                                        value={from} 
                                        onChange={setFrom}
                                        otherValue={to}
                                        stationData={stationData}
                                    />

                                    <button className="swap-button" onClick={swapStations} title="Swap stations">
                                        ⇅
                                    </button>

                                    <SimpleStationSelector 
                                        label="To (Arrival)" 
                                        value={to} 
                                        onChange={setTo}
                                        otherValue={from}
                                        stationData={stationData}
                                    />
                                </>
                            ) : (
                                <>
                                    <AdvancedStationSelector 
                                        label="From (Departure)" 
                                        value={from} 
                                        onChange={setFrom}
                                        otherValue={to}
                                        stationData={stationData}
                                    />

                                    <button className="swap-button" onClick={swapStations} title="Swap stations">
                                        ⇅
                                    </button>

                                    <AdvancedStationSelector 
                                        label="To (Arrival)" 
                                        value={to} 
                                        onChange={setTo}
                                        otherValue={from}
                                        stationData={stationData}
                                    />
                                </>
                            )}

                            <div className="form-group">
                                <label>Travel Date</label>
                                <input 
                                    type="date" 
                                    value={date} 
                                    onChange={(e) => setDate(e.target.value)}
                                    min={new Date().toISOString().split('T')[0]}
                                />
                            </div>

                            <div className="form-group">
                                <label>Number of Passengers</label>
                                <input 
                                    type="number" 
                                    value={passengers} 
                                    onChange={(e) => setPassengers(Math.max(1, parseInt(e.target.value) || 1))}
                                    min="1"
                                    max="10"
                                />
                            </div>

                            <div className="form-group">
                                <label>Travel Class {isReturnTrip && <span style={{ color: 'var(--gold)', fontSize: '0.8rem' }}>(× 2 for return)</span>}</label>
                                <div className="class-options">
                                    {CLASSES.map(cls => {
                                        const classLocalPrice = cls.priceUSD * (exchangeRates[localCurrency] || 1) * tripMultiplier;
                                        const classUSDPrice = cls.priceUSD * tripMultiplier;
                                        return (
                                            <div 
                                                key={cls.id}
                                                className={`class-option ${selectedClass === cls.id ? 'selected' : ''}`}
                                                onClick={() => setSelectedClass(cls.id)}
                                            >
                                                <div style={{ fontSize: '2rem' }}>{cls.icon}</div>
                                                <div>{cls.name}</div>
                                                <div className="price" style={{ fontSize: '0.85rem', lineHeight: '1.4' }}>
                                                    {/* Local currency prominent */}
                                                    <div style={{ fontSize: '1.1rem', fontWeight: 'bold', color: 'var(--cyan)' }}>
                                                        {formatLocalPrice(classLocalPrice)}
                                                    </div>
                                                    <div style={{ color: '#94a3b8', fontSize: '0.8rem' }}>
                                                        ${classUSDPrice} USD • {classUSDPrice} AFC
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        <div>
                            <div className="card">
                                <h2>Booking Summary</h2>
                                
                                {from && to && (
                                    <>
                                        <div className="summary-item">
                                            <span>Route</span>
                                            <span style={{ textAlign: 'right' }}>
                                                {fromStation?.city} {isReturnTrip ? '⇄' : '→'} {toStation?.city}
                                            </span>
                                        </div>
                                        <div className="summary-item">
                                            <span>Trip Type</span>
                                            <span style={{ color: isReturnTrip ? 'var(--gold)' : 'white' }}>
                                                {isReturnTrip ? '⇄ Return Trip' : '→ One Way'}
                                            </span>
                                        </div>
                                        <div className="summary-item">
                                            <span>Date</span>
                                            <span>{date || 'Not selected'}</span>
                                        </div>
                                        <div className="summary-item">
                                            <span>Passengers</span>
                                            <span>{passengers}</span>
                                        </div>
                                        <div className="summary-item">
                                            <span>Class</span>
                                            <span>{selectedClassData?.name}</span>
                                        </div>
                                        
                                        {/* Total - Local Currency Prominent */}
                                        <div style={{ 
                                            marginTop: '20px', 
                                            padding: '20px', 
                                            background: 'rgba(0,212,255,0.1)', 
                                            borderRadius: '12px',
                                            border: '1px solid rgba(0,212,255,0.3)',
                                            textAlign: 'center'
                                        }}>
                                            <div style={{ color: '#94a3b8', fontSize: '0.85rem', marginBottom: '8px' }}>
                                                TOTAL ({CURRENCY_NAMES[localCurrency]})
                                            </div>
                                            <div style={{ 
                                                fontSize: '2rem', 
                                                fontWeight: 'bold', 
                                                color: 'var(--cyan)',
                                                marginBottom: '10px'
                                            }}>
                                                {formatLocalPrice(totalPriceLocal)}
                                            </div>
                                            <div style={{ 
                                                display: 'flex', 
                                                justifyContent: 'center', 
                                                gap: '20px',
                                                fontSize: '0.9rem'
                                            }}>
                                                <span style={{ color: 'var(--gold)' }}>{totalPriceAFC} AFC</span>
                                                <span style={{ color: 'var(--green)' }}>${totalPriceUSD} USD</span>
                                            </div>
                                            <div style={{ 
                                                marginTop: '10px', 
                                                fontSize: '0.75rem', 
                                                color: '#64748b' 
                                            }}>
                                                1 USD = {exchangeRates[localCurrency]?.toFixed(2)} {localCurrency} • {rateSource === 'live' ? '🔄 Live rate' : '📊 Standard rate'}
                                            </div>
                                        </div>
                                    </>
                                )}

                                {(!from || !to) && (
                                    <p style={{ color: '#94a3b8', textAlign: 'center', padding: '20px' }}>
                                        Select your journey details to see the summary
                                    </p>
                                )}

                                <button 
                                    className="book-button"
                                    onClick={handleBooking}
                                    disabled={!from || !to || !date || isBooking}
                                >
                                    {isBooking ? 'Processing...' : isReturnTrip ? '⇄ Book Return Trip' : '→ Book Now'}
                                </button>

                                {status && (
                                    <div className={`status-message ${status.split(':')[0]}`}>
                                        {status.split(':')[1]}
                                    </div>
                                )}

                                <div className="info-box">
                                    <strong>💡 Payment Info:</strong><br/>
                                    Tickets can be paid with <strong>{CURRENCY_NAMES[localCurrency]}</strong>, AFC (Africoin stablecoin), or USD. AFC is pegged 1:1 with USD. Earn AFRC loyalty rewards on every purchase.
                                    {isReturnTrip && (
                                        <div style={{ marginTop: '10px', color: 'var(--gold)' }}>
                                            ↩️ <strong>Return trip</strong> - Your ticket includes the journey back!
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BookingApp />);
    </script>
</body>
</html>
