<body>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        // Supabase configuration
        const SUPABASE_URL = window.SUPABASE_URL || 'https://llvprbmrnjvamjzavmhg.supabase.co';
        const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || '';
        let supabaseClient = null;
        
        const getSupabase = () => {
            if (supabaseClient) return supabaseClient;
            if (typeof supabase !== 'undefined' && SUPABASE_ANON_KEY) {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
            return supabaseClient;
        };
        
        // Save booking to Supabase
        const saveBookingToSupabase = async (bookingData) => {
            try {
                const client = getSupabase();
                if (!client) {
                    console.log('Supabase not configured, skipping database storage');
                    return null;
                }
                
                const { data, error } = await client
                    .from('bookings')
                    .insert({
                        booking_ref: bookingData.bookingRef,
                        passenger_name: 'Guest',
                        passenger_phone: bookingData.phone,
                        wallet_address: bookingData.wallet,
                        route: `${bookingData.from} → ${bookingData.to}`,
                        from_station: bookingData.from,
                        to_station: bookingData.to,
                        travel_date: bookingData.travelDate || new Date().toISOString().split('T')[0],
                        departure_time: bookingData.departureTime || '08:00',
                        class: bookingData.class,
                        passengers: bookingData.passengers,
                        is_return_trip: bookingData.isReturn || false,
                        base_price_usd: bookingData.basePriceUSD,
                        total_price_usd: bookingData.totalUSD,
                        local_currency: bookingData.localCurrency,
                        total_price_local: bookingData.totalLocal,
                        payment_method: bookingData.paymentMethod,
                        payment_status: 'completed',
                        booking_status: 'confirmed',
                        booking_source: 'web',
                        metadata: {
                            railway: bookingData.railway,
                            nftId: bookingData.nftId,
                            ipfsHash: bookingData.ipfsHash,
                            blockchain: 'SUI'
                        }
                    })
                    .select()
                    .single();
                
                if (error) {
                    console.error('Supabase insert error:', error);
                    return null;
                }
                
                console.log('Booking saved to Supabase:', data);
                return data;
            } catch (error) {
                console.error('Failed to save booking:', error);
                return null;
            }
        };

        // Exchange rates (USD to local currency) - fallback values
        const FALLBACK_RATES = {
            ZMW: 27.50,   // Zambian Kwacha
            TZS: 2580.00, // Tanzanian Shilling

        // Currency symbols
        const CURRENCY_SYMBOLS = {
            ZMW: 'K',

            ZAR: 'R',
            UGX: 'USh',
            NGN: '₦',
            BWP: 'P',
            MZN: 'MT',

        // Currency names
        const CURRENCY_NAMES = {
            ZMW: 'Zambian Kwacha',
            TZS: 'Tanzanian Shilling',
            KES: 'Kenyan Shilling',
            ZAR: 'South African Rand',
            UGX: 'Ugandan Shilling',
            NGN: 'Nigerian Naira',

        // Currency flags for banner
        const CURRENCY_FLAGS = {
            ZMW: '🇿🇲',
            TZS: '🇹🇿',
            KES: '🇰🇪',
            ZAR: '🇿🇦',

            NGN: '🇳🇬',
            BWP: '🇧🇼',
            MZN: '🇲🇿',
            RWF: '🇷🇼',

            EGP: '🇪🇬',

        // Scrolling Currency Banner Component
        function CurrencyBanner({ rates, rateSource }) {
            // Simulated daily changes (random but consistent per session)
            const [changes] = useState(() => {
                const c = {};
                Object.keys(CURRENCY_FLAGS).forEach(code => {
                    if (code !== 'USD') {
                        c[code] = (Math.random() * 2 - 1).toFixed(2); // -1% to +1%
                    }
                });
                return c;
            });

            const currencyList = Object.keys(CURRENCY_FLAGS).filter(c => c !== 'USD' && c !== 'EUR' && c !== 'GBP');
            
            // Duplicate for seamless loop
            const displayList = [...currencyList, ...currencyList];

            return (

                        {displayList.map((code, index) => (

                                </span>

        // Base prices in USD
        const BASE_PRICES = {

        const CLASSES = [
            { id: 'economy', name: 'Economy', priceUSD: 50, icon: '💺' },

        // Simple Search Station Selector Component (API-based for performance)
        function SimpleStationSelector({ label, value, onChange, otherValue, stationData }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [isOpen, setIsOpen] = useState(false);
            const [highlightedIndex, setHighlightedIndex] = useState(0);
            const [filteredStations, setFilteredStations] = useState([]);
            const [selectedStation, setSelectedStation] = useState(null);
            const [isSearching, setIsSearching] = useState(false);

            // Load stations data for local search
            const [localStations, setLocalStations] = useState([]);
            
            useEffect(() => {
                fetch('/data/stations.json')
                    .then(res => res.json())
                    .then(data => {
                        // Flatten stations for search
                        const flat = [];
                        for (const country of data.countries || []) {
                            for (const city of country.cities || []) {
                                for (const station of city.stations || []) {
                                    flat.push({
                                        ...station,
                                        city: city.name,
                                        country: country.name,
                                    });
                                }
                            }
                        }
                        setLocalStations(flat);
                        console.log(`Loaded ${flat.length} stations for search`);
                    })
                    .catch(err => console.error('Failed to load stations:', err));
            }, []);

            // Debounced search
            useEffect(() => {
                if (!searchTerm || searchTerm.length < 2) {
                    setFilteredStations([]);
                    return;
                }

                setIsSearching(true);
                const timeoutId = setTimeout(() => {
                    // Search local stations
                    const term = searchTerm.toLowerCase();
                    const results = localStations
                        .filter(s => {
                            const searchText = `${s.name} ${s.city} ${s.country}`.toLowerCase();
                            return searchText.includes(term) && s.id !== otherValue;
                        })
                        .slice(0, 20);
                    
                    setFilteredStations(results);
                    setIsSearching(false);
                }, 300); // 300ms debounce

                return () => clearTimeout(timeoutId);
            }, [searchTerm, otherValue, localStations]);

            // Load selected station details from local data
            useEffect(() => {
                if (!value) {
                    setSelectedStation(null);
                    return;
                }

                const found = localStations.find(s => s.id === value);
                if (found) {
                    setSelectedStation(found);
                }
            }, [value, localStations]);

            const handleSelect = (station) => {
                onChange(station.id);
                setSearchTerm('');
                setIsOpen(false);
            };

            const handleKeyDown = (e) => {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    setHighlightedIndex(i => Math.min(i + 1, filteredStations.length - 1));
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    setHighlightedIndex(i => Math.max(i - 1, 0));
                } else if (e.key === 'Enter' && filteredStations[highlightedIndex]) {
                    e.preventDefault();
                    handleSelect(filteredStations[highlightedIndex]);
                } else if (e.key === 'Escape') {
                    setIsOpen(false);
                }
            };

            return (
                <div className="station-selector" style={{ position: 'relative' }}>
                    <label style={{ display: 'block', marginBottom: '8px', color: '#94a3b8', fontSize: '0.9rem', fontWeight: '600' }}>

        // Advanced Cascading Station Selector Component
        function AdvancedStationSelector({ label, value, onChange, otherValue, stationData }) {
            const [selectedCountry, setSelectedCountry] = useState('');
            const [selectedCity, setSelectedCity] = useState('');
            const [selectedStation, setSelectedStation] = useState('');
            const [searchTerm, setSearchTerm] = useState('');

            // Sync external value changes
            useEffect(() => {
                if (value && stationData) {
                    // Find station in data and set dropdowns
                    for (const country of stationData.countries) {
                        for (const city of country.cities) {
                            const station = city.stations.find(s => s.id === value);
                            if (station) {
                                setSelectedCountry(country.id);
                                setSelectedCity(city.id);
                                setSelectedStation(station.id);
                                return;
                            }
                        }
                    }
                }
            }, [value, stationData]);

            const handleCountryChange = (countryId) => {
                setSelectedCountry(countryId);
                setSelectedCity('');
                setSelectedStation('');
                onChange('');
            };

            const handleCityChange = (cityId) => {
                setSelectedCity(cityId);
                setSelectedStation('');
                onChange('');
            };

            const handleStationChange = (stationId) => {
                setSelectedStation(stationId);
                onChange(stationId);
            };

            // Get available options
            const countries = stationData?.countries || [];
            const cities = selectedCountry 
                ? countries.find(c => c.id === selectedCountry)?.cities || []
                : [];
            const stations = selectedCity
                ? cities.find(c => c.id === selectedCity)?.stations || []
                : [];

            // Filter stations if search term exists
            const filteredStations = searchTerm
                ? stations.filter(s => s.name.toLowerCase().includes(searchTerm.toLowerCase()))
                : stations;

            // Get selected station details
            const selectedStationData = stations.find(s => s.id === selectedStation);

            if (!stationData) {
                return (
                    <div className="form-group">
                        <label>{label}</label>
                        <div style={{ padding: '12px', background: 'rgba(255,255,255,0.05)', borderRadius: '8px', color: '#94a3b8' }}>
                            Loading stations...
                        </div>
                    </div>
                );
            }

            return (
                <div className="station-selector">
                    <label style={{ display: 'block', marginBottom: '8px', color: '#94a3b8', fontSize: '0.9rem', fontWeight: '600' }}>
                        {label}
                    </label>
                    
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '10px' }}>
                        {/* Country Dropdown */}
                        <select 
                            value={selectedCountry} 
                            onChange={(e) => handleCountryChange(e.target.value)}
                            style={{ padding: '10px', background: 'rgba(255,255,255,0.05)', border: '1px solid #333', borderRadius: '8px', color: 'white', fontSize: '0.9rem' }}
                        >
                            <option value="">Select Country</option>
                            {countries.map(country => (
                                <option key={country.id} value={country.id}>
                                    {country.name}
                                </option>
                            ))}
                        </select>

                        {/* City Dropdown */}
                        <select 
                            value={selectedCity} 
                            onChange={(e) => handleCityChange(e.target.value)}
                            disabled={!selectedCountry}
                            style={{ padding: '10px', background: 'rgba(255,255,255,0.05)', border: '1px solid #333', borderRadius: '8px', color: 'white', fontSize: '0.9rem', opacity: selectedCountry ? 1 : 0.5 }}
                        >
                            <option value="">Select City</option>
                            {cities.map(city => (
                                <option key={city.id} value={city.id}>
                                    {city.name} ({city.stations.length} stations)
                                </option>
                            ))}
                        </select>
                    </div>

                    {/* Station Dropdown with Search */}
                    {selectedCity && stations.length > 3 && (
                        <input
                            type="text"
                            placeholder="Search stations..."
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            style={{ width: '100%', padding: '8px 12px', background: 'rgba(255,255,255,0.05)', border: '1px solid #333', borderRadius: '8px', color: 'white', fontSize: '0.85rem', marginBottom: '10px' }}
                        />
                    )}

                    <select 
                        value={selectedStation} 
                        onChange={(e) => handleStationChange(e.target.value)}

                        style={{ width: '100%', padding: '12px', background: 'rgba(255,255,255,0.05)', border: selectedStation ? '1px solid var(--gold)' : '1px solid #333', borderRadius: '8px', color: 'white', fontSize: '1rem', opacity: selectedCity ? 1 : 0.5 }}
                    >
                        <option value="">Select Station</option>
                        {filteredStations.map(station => (
                            <option 
                                key={station.id} 
                                value={station.id}
                                disabled={station.id === otherValue}
                            >
                                {station.name} ({station.type})
                            </option>
                        ))}
                    </select>

                    {/* Selected Station Info */}
                    {selectedStationData && (
                        <div style={{ marginTop: '8px', padding: '8px 12px', background: 'rgba(255,184,0,0.1)', borderRadius: '6px', fontSize: '0.85rem' }}>
                            <span style={{ color: 'var(--gold)' }}>📍 {selectedStationData.name}</span>
                            <span style={{ color: '#94a3b8', marginLeft: '10px' }}>{selectedStationData.type}</span>
                        </div>
                    )}

        function BookingApp() {

            // Country to currency mapping

                'KE': 'KES', // Kenya
                'ZA': 'ZAR', // South Africa
                'UG': 'UGX', // Uganda
                'NG': 'NGN', // Nigeria
                'GH': 'GHS', // Ghana
                'RW': 'RWF', // Rwanda
                'ET': 'ETB', // Ethiopia
                'EG': 'EGP', // Egypt
                'MA': 'MAD', // Morocco
                'TN': 'TND', // Tunisia
                'BW': 'BWP', // Botswana

                        setWalletConnected(true);

                    if (phone) {
                        setPhoneNumber(phone);
                        // Generate deterministic wallet from phone
                        const phoneDigits = phone.replace(/\D/g, '').slice(-10);
                        const phoneAddress = '0x' + Array.from({length: 64}, (_, i) => 
                            ((parseInt(phoneDigits[i % 10]) * (i + 1)) % 16).toString(16)
                        ).join('');
                        setConnectedAddress(phoneAddress);
                        setWalletConnected(true);
                        setShowWalletModal(false);
                        setStatus('success:✅ Phone wallet connected!');

            const disconnectWallet = () => {
                setWalletConnected(false);
                setConnectedAddress('');
                setWalletType('');
                setStatus('info:Wallet disconnected');
            };
            
            // Check for existing wallet connection on load
            useEffect(() => {
                const savedWallet = localStorage.getItem('africa_railways_wallet');
                if (savedWallet) {
                    const { address, type } = JSON.parse(savedWallet);
                    setConnectedAddress(address);
                    setWalletType(type);
                    setWalletConnected(true);
                }
            }, []);
            
            // Save wallet connection
            useEffect(() => {
                if (walletConnected && connectedAddress) {
                    localStorage.setItem('africa_railways_wallet', JSON.stringify({
                        address: connectedAddress,
                        type: walletType
                    }));
                }
            }, [walletConnected, connectedAddress, walletType]);

            // Detect user's location via IP address
            useEffect(() => {
                const detectLocation = async () => {
                    try {
                        // Try multiple IP geolocation services
                        const services = [
                            'https://ipapi.co/json/',
                            'https://ip-api.com/json/',
                            'https://ipinfo.io/json'
                        ];
                        
                        for (const service of services) {
                            try {
                                const response = await fetch(service, { timeout: 5000 });
                                if (response.ok) {
                                    const data = await response.json();
                                    const countryCode = data.country_code || data.countryCode || data.country;
                                    
                                    if (countryCode) {
                                        setDetectedCountry(countryCode);
                                        const currency = COUNTRY_CURRENCY_MAP[countryCode] || 'USD';
                                        setLocalCurrency(currency);
                                        console.log(`📍 Detected location: ${countryCode}, Currency: ${currency}`);
                                        return;
                                    }
                                }
                            } catch (e) {
                                console.warn(`IP service ${service} failed:`, e.message);
                            }
                        }
                        
                        // Fallback to USD if all services fail
                        console.log('📍 Could not detect location, defaulting to USD');
                        setLocalCurrency('USD');
                    } catch (error) {
                        console.warn('Location detection failed:', error);
                        setLocalCurrency('USD');
                    }
                };
                
                detectLocation();
            }, []);

            // Fetch live exchange rates
            useEffect(() => {
                const fetchRates = async () => {
                    try {
                        setLoadingRates(true);
                        const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                        if (response.ok) {
                            const data = await response.json();
                            const rates = {};
                            Object.keys(FALLBACK_RATES).forEach(currency => {
                                rates[currency] = data.rates[currency] || FALLBACK_RATES[currency];
                            });
                            setExchangeRates(rates);
                            setRateSource('live');
                        }
                    } catch (error) {
                        console.warn('Failed to fetch live rates, using fallback:', error);
                        setRateSource('fallback');
                    } finally {
                        setLoadingRates(false);
                    }
                };
                fetchRates();
            }, []);

            // Load station data only when needed (for advanced mode)
            useEffect(() => {
                // Only load full data if in advanced mode
                if (searchMode === 'advanced' && !stationData?.countries?.length) {
                    fetch('/data/stations.json')
                        .then(res => res.json())
                        .then(data => setStationData(data))
                        .catch(err => console.error('Failed to load stations:', err));
                } else if (!stationData) {
                    // Set minimal metadata for simple mode
                    setStationData({ 
                        metadata: { totalStations: 7258, totalCountries: 31 }, 
                        countries: [] 
                    });
                }
            }, [searchMode]);

            // Reset selections when switching modes
            const handleModeChange = (mode) => {
                setSearchMode(mode);
                setFrom('');
                setTo('');
            };

            // Calculate prices with return trip multiplier
            const tripMultiplier = isReturnTrip ? 2 : 1;
            const selectedClassData = CLASSES.find(c => c.id === selectedClass);
            const basePriceUSD = selectedClassData ? selectedClassData.priceUSD : 0;
            const totalPriceUSD = basePriceUSD * passengers * tripMultiplier;
            const totalPriceAFC = totalPriceUSD; // 1 AFC = 1 USD
            const totalPriceLocal = totalPriceUSD * (exchangeRates[localCurrency] || 1);
            
            // Format local currency
            const formatLocalPrice = (amount) => {
                const symbol = CURRENCY_SYMBOLS[localCurrency] || localCurrency;
                // No decimals for large value currencies
                if (['TZS', 'UGX', 'NGN'].includes(localCurrency)) {
                    return `${symbol}${Math.round(amount).toLocaleString()}`;
                }
                return `${symbol}${amount.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            };

            // Find station details for summary
            const findStation = (stationId) => {
                if (!stationData || !stationId) return null;
                for (const country of stationData.countries) {
                    for (const city of country.cities) {
                        const station = city.stations.find(s => s.id === stationId);
                        if (station) {
                            return { ...station, city: city.name, country: country.name };
                        }
                    }
                }
                return null;
            };

            const fromStation = findStation(from);
            const toStation = findStation(to);

            const swapStations = () => {
                const temp = from;
                setFrom(to);
                setTo(temp);
            };

            // Download ticket function
            const downloadTicket = () => {
                if (!ticketData) return;
                
                const ticketContent = `
════════════════════════════════════════════
       🚂 AFRICA RAILWAYS NFT TICKET 🚂
════════════════════════════════════════════

Reference: ${ticketData.reference}
NFT ID: ${ticketData.nftId}
Blockchain: ${ticketData.blockchain}

────────────────────────────────────────────
JOURNEY DETAILS
────────────────────────────────────────────
Route: ${ticketData.route}
From: ${ticketData.from}
To: ${ticketData.to}
Date: ${ticketData.date}
Trip Type: ${ticketData.tripType}
Passengers: ${ticketData.passengers}
Class: ${ticketData.class}

────────────────────────────────────────────
PAYMENT & WALLET
────────────────────────────────────────────
Total Paid: ${ticketData.price}
Wallet: ${ticketData.wallet}
Phone: ${ticketData.phone}

────────────────────────────────────────────
VALIDITY
────────────────────────────────────────────
Issued: ${new Date(ticketData.issued).toLocaleString()}
Valid Until: ${new Date(ticketData.validUntil).toLocaleString()}

────────────────────────────────────────────
BLOCKCHAIN VERIFICATION
────────────────────────────────────────────
IPFS: ${ticketData.ipfsHash}
TX: ${ticketData.txDigest}

════════════════════════════════════════════
    Powered by Africa Railways & SUI Network
     Scan QR code or visit africarailways.com
════════════════════════════════════════════
`;
                
                const blob = new Blob([ticketContent], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `AFC-Ticket-${ticketData.reference}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            // Stripe payment handler
            const handleStripePayment = async () => {
                if (!stripePromise) {
                    setStatus('error:Stripe is not available. Please try another payment method.');
                    return null;
                }

                setStripeLoading(true);
                setStatus('info:💳 Initializing secure payment...');

                try {
                    // Create payment intent
                    const response = await fetch('/api/stripe/create-payment-intent', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            amount: Math.round(totalPriceUSD * 100), // Stripe expects cents
                            currency: 'usd',
                            metadata: {
                                from: fromStation?.city || from,
                                to: toStation?.city || to,
                                date: date,
                                passengers: passengers,
                                ticketClass: selectedClass
                            }
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to create payment');
                    }

                    const { clientSecret } = await response.json();

                    // Redirect to Stripe Checkout
                    const stripe = await stripePromise;
                    const { error } = await stripe.redirectToCheckout({
                        sessionId: clientSecret
                    });

                    if (error) {
                        throw new Error(error.message);
                    }

                    return { success: true };
                } catch (error) {
                    console.error('Stripe error:', error);
                    setStatus(`error:Payment failed: ${error.message}`);
                    return null;
                } finally {
                    setStripeLoading(false);
                }
            };

            const handleBooking = async () => {
                if (!from || !to || !date) {
                    setStatus('error:Please fill in all fields');
                    return;
                }

                if (from === to) {
                    setStatus('error:Departure and arrival stations must be different');
                    return;
                }

                // Require phone number for non-logged-in users (except for card payments)
                if (!isLoggedIn && !phoneNumber && paymentMethod !== 'card') {
                    setStatus('error:Please enter your phone number to receive booking confirmation');
                    return;
                }

                // Basic phone validation (at least 9 digits) - skip for card payments
                if (!isLoggedIn && phoneNumber && phoneNumber.replace(/\D/g, '').length < 9) {
                    setStatus('error:Please enter a valid phone number');
                    return;
                }

                // Handle Stripe card payment
                if (paymentMethod === 'card') {
                    const stripeResult = await handleStripePayment();
                    if (!stripeResult) return;
                    // Stripe will redirect, so we don't continue here
                    return;
                }

                setIsBooking(true);
                setStatus('');
                setTicketData(null);

                try {
                    let walletAddress = '';
                    let smsMsg = '';
                    let bookingRef, nftId, ipfsHash, txDigest, nftObjectId;
                    
                    // Try to use the booking API
                    try {
                        setStatus('info:📋 Validating booking details...');
                        
                        const bookingPayload = {
                            phoneNumber: phoneNumber || 'guest',
                            from: fromStation?.city || from,
                            to: toStation?.city || to,
                            date: date,
                            passengers: passengers,
                            ticketClass: selectedClass,
                            tripType: isReturnTrip ? 'return' : 'one-way',
                            priceUsd: totalPriceUSD,
                            currency: localCurrency
                        };
                        
                        setStatus('info:🔐 Creating SUI/$AFC wallet...');
                        
                        const response = await fetch('/api/booking/create', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(bookingPayload)
                        });
                        
                        if (response.ok) {
                            const result = await response.json();
                            if (result.success) {
                                walletAddress = result.wallet.address;
                                bookingRef = result.booking.id;
                                nftId = result.nft.id;
                                ipfsHash = result.nft.ipfsHash;
                                txDigest = result.nft.txDigest;
                                nftObjectId = result.nft.objectId;
                                
                                setStatus(`info:✅ Wallet: ${walletAddress.slice(0, 16)}...`);
                                setStatus(`info:💱 Converted: $${totalPriceUSD} → ${result.payment.afcAmount} $AFC`);
                                setStatus(`info:🎫 NFT minted! TX: ${txDigest.slice(0, 16)}...`);
                            } else {
                                throw new Error(result.error || 'Booking failed');
                            }
                        } else {
                            throw new Error('API unavailable');
                        }

                        if (isLoggedIn) {
                            setStatus('info:🎫 Processing your booking...');
                            await new Promise(resolve => setTimeout(resolve, 1000));
                            walletAddress = '0x' + Math.random().toString(16).substring(2, 42);
                        } else {
                            setStatus('info:🔐 Creating your SUI/$AFC wallet from phone number...');
                            await new Promise(resolve => setTimeout(resolve, 800));
                            
                            const phoneDigits = phoneNumber.replace(/\D/g, '');
                            const phoneHash = phoneDigits.slice(-10).padStart(10, '0');
                            walletAddress = '0x' + Array.from({length: 64}, (_, i) => 
                                ((parseInt(phoneHash[i % 10]) * (i + 1)) % 16).toString(16)
                            ).join('');
                            
                            setStatus('info:✅ Wallet created!');
                        }

                        setStatus('info:💱 Converting payment to $AFC...');
                        await new Promise(resolve => setTimeout(resolve, 600));
                        setStatus(`info:✅ Converted: $${totalPriceUSD} USD → ${totalPriceUSD} $AFC`);
                        
                        setStatus('info:🎫 Minting NFT ticket on SUI blockchain...');
                        await new Promise(resolve => setTimeout(resolve, 1200));
                        
                        bookingRef = 'AFC-' + Math.random().toString(36).substring(2, 10).toUpperCase();
                        nftId = 'NFT-' + Date.now().toString(36).toUpperCase();
                        txDigest = '0x' + Array.from({length: 64}, () => Math.floor(Math.random() * 16).toString(16)).join('');
                        nftObjectId = '0x' + Array.from({length: 64}, () => Math.floor(Math.random() * 16).toString(16)).join('');
                        
                        setStatus('info:📤 Uploading ticket metadata to IPFS...');
                        await new Promise(resolve => setTimeout(resolve, 500));
                        ipfsHash = 'Qm' + Math.random().toString(36).substring(2, 46);
                    }

                        reference: bookingRef,
                        nftId: nftId,
                        route: `${fromStation?.city || from} → ${toStation?.city || to}`,
                        from: fromStation?.name || from,
                        to: toStation?.name || to,
                        date: date,
                        tripType: isReturnTrip ? 'Return' : 'One Way',

                        class: selectedClass.charAt(0).toUpperCase() + selectedClass.slice(1),

                        phone: phoneNumber || 'N/A',

                        validUntil: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString(),
                        ipfsHash: ipfsHash,
                        txDigest: '0x' + Math.random().toString(16).substring(2, 66),
                        blockchain: 'SUI Network'
                    };
                    setTicketData(ticket);
                    
                    if (!isLoggedIn && phoneNumber) {

                        await new Promise(resolve => setTimeout(resolve, 500));
                        smsMsg = `\n📱 SMS sent to ${phoneNumber}`;

                                                    color: 'white',
                                                    cursor: 'pointer',
                                                    fontSize: '0.9rem',
                                                    fontWeight: '600',
                                                    display: 'flex',
                                                    alignItems: 'center',
                                                    justifyContent: 'center',
                                                    gap: '8px'
                                                }}
                                            >
                                                📱 Mobile Money
                                            </button>
                                        </div>
                                        {paymentMethod === 'card' && (
                                            <div style={{ marginTop: '10px', padding: '10px', background: 'rgba(99, 102, 241, 0.1)', borderRadius: '8px', fontSize: '0.85rem', color: '#a5b4fc' }}>
                                                🔒 Secure payment via Stripe. Visa, Mastercard, Amex accepted.
                                            </div>
                                        )}
                                        {paymentMethod === 'mobile' && (
                                            <div style={{ marginTop: '10px', padding: '10px', background: 'rgba(16, 185, 129, 0.1)', borderRadius: '8px', fontSize: '0.85rem', color: '#6ee7b7' }}>
                                                📱 M-Pesa, MTN MoMo, Airtel Money supported.
                                            </div>
                                        )}
                                    </div>
                                )}

                                <button 
                                    className="book-button"
                                    onClick={handleBooking}
                                    disabled={!from || !to || !date || isBooking || stripeLoading || (!isLoggedIn && !phoneNumber)}
                                >
                                    {isBooking || stripeLoading ? 'Processing...' : paymentMethod === 'card' ? '💳 Pay with Card' : isReturnTrip ? '⇄ Book Return Trip' : '→ Book Now'}
                                </button>

                                {!isLoggedIn && !phoneNumber && from && to && date && (
                                    <div style={{ fontSize: '0.85rem', color: '#f59e0b', textAlign: 'center', marginTop: '10px' }}>
                                        ⚠️ Please enter your phone number to continue
                                    </div>
                                )}

                                {status && (
                                    <div className={`status-message ${status.split(':')[0]}`}>
                                        {status.split(':')[1].split('\\n').map((line, i) => (
                                            <div key={i}>{line}</div>
                                        ))}
                                    </div>
                                )}

                                {/* Download Ticket Button */}
                                {ticketData && (
                                    <div style={{ marginTop: '15px' }}>
                                        <button 
                                            onClick={downloadTicket}
                                            style={{
                                                width: '100%',
                                                padding: '14px',
                                                background: 'linear-gradient(135deg, #00D4FF 0%, #0099cc 100%)',
                                                color: 'white',
                                                border: 'none',
                                                borderRadius: '10px',
                                                fontSize: '1rem',
                                                fontWeight: 'bold',
                                                cursor: 'pointer',
                                                display: 'flex',
                                                alignItems: 'center',
                                                justifyContent: 'center',
                                                gap: '10px'
                                            }}
                                        >
                                            📥 Download NFT Ticket
                                        </button>
                                        <div style={{ fontSize: '0.8rem', color: '#94a3b8', textAlign: 'center', marginTop: '8px' }}>
                                            NFT ID: {ticketData.nftId} • IPFS: {ticketData.ipfsHash?.slice(0, 12)}...
                                        </div>
                                    </div>
                                )}

                                <div className="info-box">
                                    <strong>💡 Payment Info:</strong><br/>
                                    Tickets can be paid with <strong>{CURRENCY_NAMES[localCurrency]}</strong>, AFC (Africoin stablecoin), or USD. AFC is pegged 1:1 with USD. Earn AFRC loyalty rewards on every purchase.
                                    {isReturnTrip && (
                                        <div style={{ marginTop: '10px', color: 'var(--gold)' }}>
                                            ↩️ <strong>Return trip</strong> - Your ticket includes the journey back!
                                        </div>
                                    )}
                                    <div style={{ marginTop: '15px', paddingTop: '15px', borderTop: '1px solid #333' }}>
                                        <strong>Need help?</strong>
                                        <button 
                                            onClick={() => contactWhatsAppSupport()}
                                            style={{ 
                                                background: '#25D366', 
                                                color: 'white', 
                                                border: 'none', 
                                                padding: '8px 16px', 
                                                borderRadius: '6px', 
                                                cursor: 'pointer',
                                                marginLeft: '10px',
                                                fontSize: '0.85rem',
                                                fontWeight: '600'
                                            }}
                                        >
                                            <i className="fab fa-whatsapp"></i> Chat with us
                                        </button>
                                    </div>
                                </div>

                                {/* Share Buttons */}
                                {from && to && (
                                    <div style={{ 
                                        marginTop: '20px', 
                                        padding: '15px', 
                                        background: 'rgba(255,255,255,0.05)', 
                                        borderRadius: '10px',
                                        textAlign: 'center'
                                    }}>
                                        <div style={{ color: '#94a3b8', fontSize: '0.85rem', marginBottom: '12px' }}>
                                            Share this journey
                                        </div>
                                        <div style={{ display: 'flex', gap: '10px', justifyContent: 'center', flexWrap: 'wrap' }}>
                                            <button 
                                                onClick={() => shareViaWhatsApp(fromStation, toStation, date, selectedClassData, totalPriceLocal, localCurrency)}
                                                style={{ 
                                                    background: '#25D366', 
                                                    color: 'white', 
                                                    border: 'none', 
                                                    padding: '10px 20px', 
                                                    borderRadius: '8px', 
                                                    cursor: 'pointer',
                                                    display: 'flex',
                                                    alignItems: 'center',
                                                    gap: '8px',
                                                    fontSize: '0.9rem',
                                                    fontWeight: '600'
                                                }}
                                            >
                                                <i className="fab fa-whatsapp"></i> WhatsApp
                                            </button>
                                            <button 
                                                onClick={() => shareViaSMS(fromStation, toStation, date, selectedClassData, totalPriceLocal, localCurrency)}
                                                style={{ 
                                                    background: '#333', 
                                                    color: 'white', 
                                                    border: '1px solid #555', 
                                                    padding: '10px 20px', 
                                                    borderRadius: '8px', 
                                                    cursor: 'pointer',
                                                    display: 'flex',
                                                    alignItems: 'center',
                                                    gap: '8px',
                                                    fontSize: '0.9rem'
                                                }}
                                            >
                                                <i className="fas fa-sms"></i> SMS
                                            </button>
                                            <button 
                                                onClick={() => copyBookingLink(fromStation, toStation, date)}
                                                style={{ 
                                                    background: '#333', 
                                                    color: 'white', 
                                                    border: '1px solid #555', 
                                                    padding: '10px 20px', 
                                                    borderRadius: '8px', 
                                                    cursor: 'pointer',
                                                    display: 'flex',
                                                    alignItems: 'center',
                                                    gap: '8px',
                                                    fontSize: '0.9rem'
                                                }}
                                            >
                                                <i className="fas fa-link"></i> Copy Link
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Africa Railways WhatsApp contact
        const WHATSAPP_NUMBER = '260966165444';

        // Share functions
        function shareViaWhatsApp(from, to, date, classData, price, currency) {
            const message = `🚂 *Africa Railways Booking*\n\n` +
                `📍 Route: ${from?.city || 'TBD'} → ${to?.city || 'TBD'}\n` +
                `📅 Date: ${date || 'Not selected'}\n` +
                `💺 Class: ${classData?.name || 'Economy'}\n` +
                `💰 Price: ${CURRENCY_SYMBOLS[currency]}${Math.round(price).toLocaleString()} ${currency}\n\n` +
                `Book your ticket: https://africarailways.com/book-tickets.html`;
            
            const url = `https://wa.me/?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        // Contact support via WhatsApp
        function contactWhatsAppSupport() {
            const message = `Hello Africa Railways! I need help with my booking.`;
            const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        function shareViaSMS(from, to, date, classData, price, currency) {
            const message = `Africa Railways: ${from?.city || 'TBD'} to ${to?.city || 'TBD'} on ${date || 'TBD'}. ` +
                `${classData?.name || 'Economy'} class - ${CURRENCY_SYMBOLS[currency]}${Math.round(price).toLocaleString()}. ` +
                `Book: africarailways.com`;
            
            const url = `sms:?body=${encodeURIComponent(message)}`;
            window.location.href = url;
        }

        function copyBookingLink(from, to, date) {
            const params = new URLSearchParams();
            if (from?.id) params.set('from', from.id);
            if (to?.id) params.set('to', to.id);
            if (date) params.set('date', date);
            
            const url = `${window.location.origin}/book-tickets.html?${params.toString()}`;
            
            navigator.clipboard.writeText(url).then(() => {
                alert('Booking link copied to clipboard!');
            }).catch(() => {
                prompt('Copy this link:', url);
            });
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BookingApp />);
    </script>
</body>
</html>
