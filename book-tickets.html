<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎫 Book Tickets - Africa Railways</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --navy: #0a0e1a;
            --gold: #FFB800;
            --cyan: #00D4FF;
            --white: #ffffff;
            --surface: #16203a;
            --green: #10b981;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--navy);
            color: var(--white);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, var(--surface) 0%, #1a2642 100%);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--gold) 0%, var(--cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .back-button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #333;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--gold);
        }
        
        .booking-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .card {
            background: var(--surface);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #333;
        }
        
        .card h2 {
            color: var(--gold);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }
        
        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
        }
        
        .swap-button {
            background: var(--gold);
            border: none;
            color: var(--navy);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            margin: 10px auto;
            display: block;
            width: 40px;
            height: 40px;
            transition: all 0.3s;
        }
        
        .swap-button:hover {
            transform: rotate(180deg);
        }
        
        .class-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        
        .class-option {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #333;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        
        .class-option:hover {
            border-color: var(--gold);
        }
        
        .class-option.selected {
            border-color: var(--gold);
            background: rgba(255, 184, 0, 0.1);
        }
        
        .class-option .price {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--gold);
            margin-top: 5px;
        }
        
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #333;
        }
        
        .summary-item:last-child {
            border-bottom: none;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--gold);
        }
        
        .book-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--gold) 0%, #ff9500 100%);
            color: var(--navy);
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        
        .book-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 184, 0, 0.4);
        }
        
        .book-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }
        
        .status-message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
        }
        
        .status-message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        
        .info-box {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        
        .payment-banner {
            background: linear-gradient(135deg, rgba(255, 184, 0, 0.15), rgba(0, 212, 255, 0.15));
            border: 2px solid var(--gold);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .payment-banner h3 {
            color: var(--gold);
            margin-bottom: 10px;
            font-size: 1.3rem;
        }
        
        .payment-banner p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.6;
        }
        
        .payment-banner strong {
            color: var(--cyan);
        }
        
        @media (max-width: 768px) {
            .booking-grid {
                grid-template-columns: 1fr;
            }
            
            .class-options {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const CLASSES = [
            { id: 'economy', name: 'Economy', priceUSD: 50, priceAFC: 50, priceLocal: 'TZS 130,000', icon: '💺' },
            { id: 'business', name: 'Business', priceUSD: 120, priceAFC: 120, priceLocal: 'TZS 312,000', icon: '🛋️' },
            { id: 'first', name: 'First Class', priceUSD: 200, priceAFC: 200, priceLocal: 'TZS 520,000', icon: '👑' },
        ];

        // Simple Search Station Selector Component (API-based for performance)
        function SimpleStationSelector({ label, value, onChange, otherValue, stationData }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [isOpen, setIsOpen] = useState(false);
            const [highlightedIndex, setHighlightedIndex] = useState(0);
            const [filteredStations, setFilteredStations] = useState([]);
            const [selectedStation, setSelectedStation] = useState(null);
            const [isSearching, setIsSearching] = useState(false);

            // Debounced search
            useEffect(() => {
                if (!searchTerm || searchTerm.length < 2) {
                    setFilteredStations([]);
                    return;
                }

                setIsSearching(true);
                const timeoutId = setTimeout(() => {
                    // Try API first, fallback to local search
                    fetch(`/api/stations/search?q=${encodeURIComponent(searchTerm)}&limit=20`)
                        .then(res => res.json())
                        .then(data => {
                            const results = (data.results || []).filter(s => s.id !== otherValue);
                            setFilteredStations(results);
                            setIsSearching(false);
                        })
                        .catch(() => {
                            // Fallback to local search if API not available
                            if (stationData) {
                                const term = searchTerm.toLowerCase();
                                const results = [];
                                for (const country of stationData.countries) {
                                    for (const city of country.cities) {
                                        for (const station of city.stations) {
                                            const searchText = `${station.name} ${city.name} ${country.name}`.toLowerCase();
                                            if (searchText.includes(term) && station.id !== otherValue) {
                                                results.push({ ...station, city: city.name, country: country.name });
                                                if (results.length >= 20) break;
                                            }
                                        }
                                        if (results.length >= 20) break;
                                    }
                                    if (results.length >= 20) break;
                                }
                                setFilteredStations(results);
                            }
                            setIsSearching(false);
                        });
                }, 300); // 300ms debounce

                return () => clearTimeout(timeoutId);
            }, [searchTerm, otherValue, stationData]);

            // Load selected station details
            useEffect(() => {
                if (!value) {
                    setSelectedStation(null);
                    return;
                }

                // Try API first
                fetch(`/api/stations/station?id=${encodeURIComponent(value)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.id) {
                            setSelectedStation(data);
                        }
                    })
                    .catch(() => {
                        // Fallback to local search
                        if (stationData) {
                            for (const country of stationData.countries) {
                                for (const city of country.cities) {
                                    const station = city.stations.find(s => s.id === value);
                                    if (station) {
                                        setSelectedStation({ ...station, city: city.name, country: country.name });
                                        return;
                                    }
                                }
                            }
                        }
                    });
            }, [value, stationData]);

            const handleSelect = (station) => {
                onChange(station.id);
                setSearchTerm('');
                setIsOpen(false);
            };

            const handleKeyDown = (e) => {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    setHighlightedIndex(i => Math.min(i + 1, filteredStations.length - 1));
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    setHighlightedIndex(i => Math.max(i - 1, 0));
                } else if (e.key === 'Enter' && filteredStations[highlightedIndex]) {
                    e.preventDefault();
                    handleSelect(filteredStations[highlightedIndex]);
                } else if (e.key === 'Escape') {
                    setIsOpen(false);
                }
            };

            return (
                <div className="station-selector" style={{ position: 'relative' }}>
                    <label style={{ display: 'block', marginBottom: '8px', color: '#94a3b8', fontSize: '0.9rem', fontWeight: '600' }}>
                        {label}
                    </label>
                    
                    <input
                        type="text"
                        placeholder="Type to search stations..."
                        value={searchTerm}
                        onChange={(e) => {
                            setSearchTerm(e.target.value);
                            setIsOpen(true);
                            setHighlightedIndex(0);
                        }}
                        onFocus={() => setIsOpen(true)}
                        onBlur={() => setTimeout(() => setIsOpen(false), 200)}
                        onKeyDown={handleKeyDown}
                        style={{ 
                            width: '100%', 
                            padding: '12px', 
                            background: 'rgba(255,255,255,0.05)', 
                            border: selectedStation ? '1px solid var(--gold)' : '1px solid #333', 
                            borderRadius: '8px', 
                            color: 'white', 
                            fontSize: '1rem' 
                        }}
                    />

                    {/* Dropdown Results */}
                    {isOpen && filteredStations.length > 0 && (
                        <div style={{
                            position: 'absolute',
                            top: '100%',
                            left: 0,
                            right: 0,
                            background: '#1a2642',
                            border: '1px solid #333',
                            borderRadius: '8px',
                            marginTop: '4px',
                            maxHeight: '300px',
                            overflowY: 'auto',
                            zIndex: 100,
                            boxShadow: '0 10px 40px rgba(0,0,0,0.5)',
                        }}>
                            {filteredStations.map((station, index) => (
                                <div
                                    key={station.id}
                                    onClick={() => handleSelect(station)}
                                    style={{
                                        padding: '12px 15px',
                                        cursor: 'pointer',
                                        borderBottom: '1px solid #333',
                                        background: index === highlightedIndex ? 'rgba(255,184,0,0.1)' : 'transparent',
                                    }}
                                    onMouseEnter={() => setHighlightedIndex(index)}
                                >
                                    <div style={{ fontWeight: '600', color: 'white' }}>{station.name}</div>
                                    <div style={{ fontSize: '0.8rem', color: '#94a3b8' }}>
                                        {station.city}, {station.country}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Selected Station Display */}
                    {selectedStation && (
                        <div style={{ 
                            marginTop: '8px', 
                            padding: '10px 12px', 
                            background: 'rgba(255,184,0,0.1)', 
                            borderRadius: '6px',
                            display: 'flex',
                            justifyContent: 'space-between',
                            alignItems: 'center',
                        }}>
                            <div>
                                <span style={{ color: 'var(--gold)', fontWeight: '600' }}>📍 {selectedStation.name}</span>
                                <span style={{ color: '#94a3b8', marginLeft: '10px', fontSize: '0.85rem' }}>
                                    {selectedStation.city}, {selectedStation.country}
                                </span>
                            </div>
                            <button 
                                onClick={() => onChange('')}
                                style={{ 
                                    background: 'none', 
                                    border: 'none', 
                                    color: '#94a3b8', 
                                    cursor: 'pointer',
                                    fontSize: '1.2rem',
                                }}
                            >
                                ✕
                            </button>
                        </div>
                    )}

                    {searchTerm.length > 0 && searchTerm.length < 2 && (
                        <div style={{ marginTop: '8px', color: '#94a3b8', fontSize: '0.85rem' }}>
                            Type at least 2 characters to search...
                        </div>
                    )}

                    {isSearching && (
                        <div style={{ marginTop: '8px', color: '#94a3b8', fontSize: '0.85rem' }}>
                            Searching...
                        </div>
                    )}

                    {searchTerm.length >= 2 && !isSearching && filteredStations.length === 0 && (
                        <div style={{ marginTop: '8px', color: '#94a3b8', fontSize: '0.85rem' }}>
                            No stations found for "{searchTerm}"
                        </div>
                    )}
                </div>
            );
        }

        // Advanced Cascading Station Selector Component
        function AdvancedStationSelector({ label, value, onChange, otherValue, stationData }) {
            const [selectedCountry, setSelectedCountry] = useState('');
            const [selectedCity, setSelectedCity] = useState('');
            const [selectedStation, setSelectedStation] = useState('');
            const [searchTerm, setSearchTerm] = useState('');

            // Sync external value changes
            useEffect(() => {
                if (value && stationData) {
                    // Find station in data and set dropdowns
                    for (const country of stationData.countries) {
                        for (const city of country.cities) {
                            const station = city.stations.find(s => s.id === value);
                            if (station) {
                                setSelectedCountry(country.id);
                                setSelectedCity(city.id);
                                setSelectedStation(station.id);
                                return;
                            }
                        }
                    }
                }
            }, [value, stationData]);

            const handleCountryChange = (countryId) => {
                setSelectedCountry(countryId);
                setSelectedCity('');
                setSelectedStation('');
                onChange('');
            };

            const handleCityChange = (cityId) => {
                setSelectedCity(cityId);
                setSelectedStation('');
                onChange('');
            };

            const handleStationChange = (stationId) => {
                setSelectedStation(stationId);
                onChange(stationId);
            };

            // Get available options
            const countries = stationData?.countries || [];
            const cities = selectedCountry 
                ? countries.find(c => c.id === selectedCountry)?.cities || []
                : [];
            const stations = selectedCity
                ? cities.find(c => c.id === selectedCity)?.stations || []
                : [];

            // Filter stations if search term exists
            const filteredStations = searchTerm
                ? stations.filter(s => s.name.toLowerCase().includes(searchTerm.toLowerCase()))
                : stations;

            // Get selected station details
            const selectedStationData = stations.find(s => s.id === selectedStation);

            if (!stationData) {
                return (
                    <div className="form-group">
                        <label>{label}</label>
                        <div style={{ padding: '12px', background: 'rgba(255,255,255,0.05)', borderRadius: '8px', color: '#94a3b8' }}>
                            Loading stations...
                        </div>
                    </div>
                );
            }

            return (
                <div className="station-selector">
                    <label style={{ display: 'block', marginBottom: '8px', color: '#94a3b8', fontSize: '0.9rem', fontWeight: '600' }}>
                        {label}
                    </label>
                    
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '10px' }}>
                        {/* Country Dropdown */}
                        <select 
                            value={selectedCountry} 
                            onChange={(e) => handleCountryChange(e.target.value)}
                            style={{ padding: '10px', background: 'rgba(255,255,255,0.05)', border: '1px solid #333', borderRadius: '8px', color: 'white', fontSize: '0.9rem' }}
                        >
                            <option value="">Select Country</option>
                            {countries.map(country => (
                                <option key={country.id} value={country.id}>
                                    {country.name}
                                </option>
                            ))}
                        </select>

                        {/* City Dropdown */}
                        <select 
                            value={selectedCity} 
                            onChange={(e) => handleCityChange(e.target.value)}
                            disabled={!selectedCountry}
                            style={{ padding: '10px', background: 'rgba(255,255,255,0.05)', border: '1px solid #333', borderRadius: '8px', color: 'white', fontSize: '0.9rem', opacity: selectedCountry ? 1 : 0.5 }}
                        >
                            <option value="">Select City</option>
                            {cities.map(city => (
                                <option key={city.id} value={city.id}>
                                    {city.name} ({city.stations.length} stations)
                                </option>
                            ))}
                        </select>
                    </div>

                    {/* Station Dropdown with Search */}
                    {selectedCity && stations.length > 3 && (
                        <input
                            type="text"
                            placeholder="Search stations..."
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            style={{ width: '100%', padding: '8px 12px', background: 'rgba(255,255,255,0.05)', border: '1px solid #333', borderRadius: '8px', color: 'white', fontSize: '0.85rem', marginBottom: '10px' }}
                        />
                    )}

                    <select 
                        value={selectedStation} 
                        onChange={(e) => handleStationChange(e.target.value)}
                        disabled={!selectedCity}
                        style={{ width: '100%', padding: '12px', background: 'rgba(255,255,255,0.05)', border: selectedStation ? '1px solid var(--gold)' : '1px solid #333', borderRadius: '8px', color: 'white', fontSize: '1rem', opacity: selectedCity ? 1 : 0.5 }}
                    >
                        <option value="">Select Station</option>
                        {filteredStations.map(station => (
                            <option 
                                key={station.id} 
                                value={station.id}
                                disabled={station.id === otherValue}
                            >
                                {station.name} ({station.type})
                            </option>
                        ))}
                    </select>

                    {/* Selected Station Info */}
                    {selectedStationData && (
                        <div style={{ marginTop: '8px', padding: '8px 12px', background: 'rgba(255,184,0,0.1)', borderRadius: '6px', fontSize: '0.85rem' }}>
                            <span style={{ color: 'var(--gold)' }}>📍 {selectedStationData.name}</span>
                            <span style={{ color: '#94a3b8', marginLeft: '10px' }}>{selectedStationData.type}</span>
                        </div>
                    )}
                </div>
            );
        }

        function BookingApp() {
            const [stationData, setStationData] = useState(null);
            const [from, setFrom] = useState('');
            const [to, setTo] = useState('');
            const [date, setDate] = useState('');
            const [passengers, setPassengers] = useState(1);
            const [selectedClass, setSelectedClass] = useState('economy');
            const [status, setStatus] = useState('');
            const [isBooking, setIsBooking] = useState(false);
            const [searchMode, setSearchMode] = useState('simple'); // 'simple' or 'advanced'

            // Load station data - try API first for better performance
            useEffect(() => {
                // Try to load just metadata first for quick display
                fetch('/api/stations/metadata')
                    .then(res => res.json())
                    .then(metadata => {
                        setStationData({ metadata, countries: [] });
                        // Then load full data in background for advanced search
                        return fetch('/data/stations.json');
                    })
                    .then(res => res.json())
                    .then(data => setStationData(data))
                    .catch(() => {
                        // Fallback: load full JSON directly
                        fetch('/data/stations.json')
                            .then(res => res.json())
                            .then(data => setStationData(data))
                            .catch(err => console.error('Failed to load stations:', err));
                    });
            }, []);

            // Reset selections when switching modes
            const handleModeChange = (mode) => {
                setSearchMode(mode);
                setFrom('');
                setTo('');
            };

            const selectedClassData = CLASSES.find(c => c.id === selectedClass);
            const totalPriceUSD = selectedClassData ? selectedClassData.priceUSD * passengers : 0;
            const totalPriceAFC = selectedClassData ? selectedClassData.priceAFC * passengers : 0;

            // Find station details for summary
            const findStation = (stationId) => {
                if (!stationData || !stationId) return null;
                for (const country of stationData.countries) {
                    for (const city of country.cities) {
                        const station = city.stations.find(s => s.id === stationId);
                        if (station) {
                            return { ...station, city: city.name, country: country.name };
                        }
                    }
                }
                return null;
            };

            const fromStation = findStation(from);
            const toStation = findStation(to);

            const swapStations = () => {
                const temp = from;
                setFrom(to);
                setTo(temp);
            };

            const handleBooking = async () => {
                if (!from || !to || !date) {
                    setStatus('error:Please fill in all fields');
                    return;
                }

                if (from === to) {
                    setStatus('error:Departure and arrival stations must be different');
                    return;
                }

                setIsBooking(true);
                setStatus('');

                try {
                    // Simulate booking process
                    await new Promise(resolve => setTimeout(resolve, 2000));

                    // In production, this would call the blockchain smart contract
                    const bookingRef = 'AFC-' + Math.random().toString(36).substring(2, 10).toUpperCase();
                    
                    setStatus(`success:✅ Booking confirmed! Reference: ${bookingRef}`);
                    
                    // Reset form after 3 seconds
                    setTimeout(() => {
                        setFrom('');
                        setTo('');
                        setDate('');
                        setPassengers(1);
                        setSelectedClass('economy');
                        setStatus('');
                    }, 5000);
                } catch (error) {
                    setStatus('error:❌ Booking failed. Please try again.');
                } finally {
                    setIsBooking(false);
                }
            };

            const fromStation = STATIONS.find(s => s.id === from);
            const toStation = STATIONS.find(s => s.id === to);

            return (
                <div className="container">
                    <div className="header">
                        <div>
                            <h1>🎫 Book Train Tickets</h1>
                            <p style={{ color: '#94a3b8', marginTop: '5px' }}>
                                Travel across Africa with blockchain-verified tickets
                            </p>
                        </div>
                        <a href="/" className="back-button">
                            <i className="fas fa-arrow-left"></i>
                            Back to Home
                        </a>
                    </div>

                    <div className="payment-banner">
                        <h3>💳 Payment & Rewards</h3>
                        <p>
                            Pay with <strong>local currency (TZS)</strong>, <strong>AFC (Africoin stablecoin)</strong>, or <strong>USD</strong>. 
                            Multi-currency support for seamless cross-border travel across Africa.
                        </p>
                        <p style={{ marginTop: '10px', fontSize: '0.9rem' }}>
                            Earn <strong>AFRC rewards</strong> on every journey • Stake for 12% APY • Vote on governance
                        </p>
                    </div>

                    <div className="booking-grid">
                        <div className="card">
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                                <h2 style={{ margin: 0 }}>Journey Details</h2>
                                
                                {/* Search Mode Toggle */}
                                <div style={{ display: 'flex', gap: '5px', background: 'rgba(255,255,255,0.05)', borderRadius: '8px', padding: '4px' }}>
                                    <button
                                        onClick={() => handleModeChange('simple')}
                                        style={{
                                            padding: '8px 16px',
                                            border: 'none',
                                            borderRadius: '6px',
                                            cursor: 'pointer',
                                            fontSize: '0.85rem',
                                            fontWeight: '600',
                                            background: searchMode === 'simple' ? 'var(--gold)' : 'transparent',
                                            color: searchMode === 'simple' ? 'var(--navy)' : '#94a3b8',
                                            transition: 'all 0.2s',
                                        }}
                                    >
                                        🔍 Simple
                                    </button>
                                    <button
                                        onClick={() => handleModeChange('advanced')}
                                        style={{
                                            padding: '8px 16px',
                                            border: 'none',
                                            borderRadius: '6px',
                                            cursor: 'pointer',
                                            fontSize: '0.85rem',
                                            fontWeight: '600',
                                            background: searchMode === 'advanced' ? 'var(--gold)' : 'transparent',
                                            color: searchMode === 'advanced' ? 'var(--navy)' : '#94a3b8',
                                            transition: 'all 0.2s',
                                        }}
                                    >
                                        🗂️ Advanced
                                    </button>
                                </div>
                            </div>

                            {/* Station count info */}
                            {stationData && (
                                <div style={{ marginBottom: '20px', padding: '10px 15px', background: 'rgba(0,212,255,0.1)', borderRadius: '8px', fontSize: '0.85rem', color: '#94a3b8' }}>
                                    📊 {stationData.metadata.totalStations.toLocaleString()} stations across {stationData.metadata.totalCountries} countries
                                </div>
                            )}
                            
                            {searchMode === 'simple' ? (
                                <>
                                    <SimpleStationSelector 
                                        label="From (Departure)" 
                                        value={from} 
                                        onChange={setFrom}
                                        otherValue={to}
                                        stationData={stationData}
                                    />

                                    <button className="swap-button" onClick={swapStations} title="Swap stations">
                                        ⇅
                                    </button>

                                    <SimpleStationSelector 
                                        label="To (Arrival)" 
                                        value={to} 
                                        onChange={setTo}
                                        otherValue={from}
                                        stationData={stationData}
                                    />
                                </>
                            ) : (
                                <>
                                    <AdvancedStationSelector 
                                        label="From (Departure)" 
                                        value={from} 
                                        onChange={setFrom}
                                        otherValue={to}
                                        stationData={stationData}
                                    />

                                    <button className="swap-button" onClick={swapStations} title="Swap stations">
                                        ⇅
                                    </button>

                                    <AdvancedStationSelector 
                                        label="To (Arrival)" 
                                        value={to} 
                                        onChange={setTo}
                                        otherValue={from}
                                        stationData={stationData}
                                    />
                                </>
                            )}

                            <div className="form-group">
                                <label>Travel Date</label>
                                <input 
                                    type="date" 
                                    value={date} 
                                    onChange={(e) => setDate(e.target.value)}
                                    min={new Date().toISOString().split('T')[0]}
                                />
                            </div>

                            <div className="form-group">
                                <label>Number of Passengers</label>
                                <input 
                                    type="number" 
                                    value={passengers} 
                                    onChange={(e) => setPassengers(Math.max(1, parseInt(e.target.value) || 1))}
                                    min="1"
                                    max="10"
                                />
                            </div>

                            <div className="form-group">
                                <label>Travel Class</label>
                                <div className="class-options">
                                    {CLASSES.map(cls => (
                                        <div 
                                            key={cls.id}
                                            className={`class-option ${selectedClass === cls.id ? 'selected' : ''}`}
                                            onClick={() => setSelectedClass(cls.id)}
                                        >
                                            <div style={{ fontSize: '2rem' }}>{cls.icon}</div>
                                            <div>{cls.name}</div>
                                            <div className="price" style={{ fontSize: '0.85rem', lineHeight: '1.4' }}>
                                                <div>{cls.priceLocal}</div>
                                                <div>{cls.priceAFC} AFC</div>
                                                <div>${cls.priceUSD} USD</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div>
                            <div className="card">
                                <h2>Booking Summary</h2>
                                
                                {from && to && (
                                    <>
                                        <div className="summary-item">
                                            <span>Route</span>
                                            <span style={{ textAlign: 'right' }}>
                                                {fromStation?.city} → {toStation?.city}
                                            </span>
                                        </div>
                                        <div className="summary-item">
                                            <span>Date</span>
                                            <span>{date || 'Not selected'}</span>
                                        </div>
                                        <div className="summary-item">
                                            <span>Passengers</span>
                                            <span>{passengers}</span>
                                        </div>
                                        <div className="summary-item">
                                            <span>Class</span>
                                            <span>{selectedClassData?.name}</span>
                                        </div>
                                        <div className="summary-item">
                                            <span>Price per ticket</span>
                                            <span style={{ textAlign: 'right', fontSize: '0.9rem', lineHeight: '1.5' }}>
                                                <div>{selectedClassData?.priceLocal}</div>
                                                <div>{selectedClassData?.priceAFC} AFC</div>
                                                <div>${selectedClassData?.priceUSD} USD</div>
                                            </span>
                                        </div>
                                        <div className="summary-item" style={{ borderTop: '1px solid #333', paddingTop: '15px', marginTop: '10px' }}>
                                            <span style={{ fontWeight: 'bold', color: 'var(--gold)' }}>Total</span>
                                            <span style={{ textAlign: 'right', fontSize: '1rem', lineHeight: '1.5', fontWeight: 'bold' }}>
                                                <div style={{ color: 'var(--cyan)' }}>{selectedClassData ? `TZS ${(parseInt(selectedClassData.priceLocal.split(' ')[1].replace(/,/g, '')) * passengers).toLocaleString()}` : ''}</div>
                                                <div style={{ color: 'var(--gold)' }}>{totalPriceAFC} AFC</div>
                                                <div style={{ color: 'var(--green)' }}>${totalPriceUSD} USD</div>
                                            </span>
                                        </div>
                                    </>
                                )}

                                {(!from || !to) && (
                                    <p style={{ color: '#94a3b8', textAlign: 'center', padding: '20px' }}>
                                        Select your journey details to see the summary
                                    </p>
                                )}

                                <button 
                                    className="book-button"
                                    onClick={handleBooking}
                                    disabled={!from || !to || !date || isBooking}
                                >
                                    {isBooking ? 'Processing...' : 'Book Now'}
                                </button>

                                {status && (
                                    <div className={`status-message ${status.split(':')[0]}`}>
                                        {status.split(':')[1]}
                                    </div>
                                )}

                                <div className="info-box">
                                    <strong>💡 Payment Info:</strong><br/>
                                    Tickets can be paid with local currency (TZS), AFC (Africoin stablecoin), or USD. AFC is pegged 1:1 with USD. Earn AFRC loyalty rewards on every purchase.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BookingApp />);
    </script>
</body>
</html>
