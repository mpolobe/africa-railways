<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Login - Africa Railways</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1877f2;
            --secondary: #42b72a;
            --dark: #18191a;
            --surface: #242526;
            --hover: #3a3b3c;
            --border: #3e4042;
            --text-primary: #e4e6eb;
            --text-secondary: #b0b3b8;
            --gold: #FFB800;
            --success: #00d084;
            --danger: #f02849;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #0a0e1a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: var(--surface);
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-img {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            margin-bottom: 15px;
            animation: glow 2s ease-in-out infinite;
            filter: drop-shadow(0 0 12px rgba(255, 184, 0, 0.6));
        }

        @keyframes glow {
            0%, 100% {
                filter: drop-shadow(0 0 12px rgba(255, 184, 0, 0.6));
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(255, 184, 0, 0.9)) drop-shadow(0 0 30px rgba(255, 184, 0, 0.5));
            }
        }

        .logo-title {
            font-size: 28px;
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .logo-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: var(--hover);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--gold);
            background: var(--dark);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 12px;
        }

        .btn-primary {
            background: var(--gold);
            color: var(--dark);
        }

        .btn-primary:hover {
            background: #FFC933;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 184, 0, 0.4);
        }

        .btn-demo {
            background: var(--hover);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-demo:hover {
            background: var(--border);
            border-color: var(--gold);
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: var(--text-secondary);
            font-size: 14px;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: var(--border);
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .error-message {
            background: rgba(240, 40, 73, 0.2);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .success-message {
            background: rgba(0, 208, 132, 0.2);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .info-box {
            background: rgba(255, 184, 0, 0.1);
            border: 1px solid var(--gold);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .info-box strong {
            color: var(--gold);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--gold);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            .logo-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <img src="sentinel-logo.png" alt="Sentinel Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="logo-title">🛡️ Sentinel Portal</div>
            <div class="logo-subtitle">Railway Safety Monitoring System</div>
        </div>

        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="Enter your username or email"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn btn-primary">
                🔐 Login
            </button>
        </form>

        <div class="divider">OR</div>

        <button class="btn btn-demo" onclick="loginAsDemo()">
            👤 Try Demo Account
        </button>

        <div class="info-box">
            <strong>Demo Account:</strong> Explore the dashboard with limited access.<br>
            <strong>Staff Login:</strong> Use your assigned credentials.<br>
            <strong>Super Admin:</strong> Full system access.
        </div>

        <div class="back-link">
            <a href="/">← Back to Homepage</a>
        </div>
    </div>

    <script>
        // User accounts database (in production, this would be server-side)
        const users = {
            // Super Admin Account
            'admin': {
                password: 'sentinel2026',
                type: 'super_admin',
                name: 'Benjamin Mpolokoso',
                id: 'admin-1',
                avatar: ''
            },
            // Demo Account
            'demo': {
                password: 'demo123',
                type: 'demo',
                name: 'Demo User',
                id: 'demo-1',
                avatar: ''
            },
            // Example Staff Accounts (these would be created through the dashboard)
            'staff1': {
                password: 'staff123',
                type: 'staff',
                name: 'John Mwansa',
                id: 'staff-1',
                avatar: ''
            },
            'staff2': {
                password: 'staff123',
                type: 'staff',
                name: 'Sarah Banda',
                id: 'staff-2',
                avatar: ''
            }
        };

        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const successEl = document.getElementById('success-message');
            successEl.textContent = message;
            successEl.style.display = 'block';
        }

        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            // Check if user exists
            if (!users[username]) {
                showError('Invalid username or password');
                return;
            }

            // Check password
            if (users[username].password !== password) {
                showError('Invalid username or password');
                return;
            }

            // Successful login
            const user = users[username];
            
            // Store session
            const session = {
                id: user.id,
                type: user.type,
                name: user.name,
                avatar: user.avatar,
                username: username,
                loginTime: new Date().toISOString()
            };

            localStorage.setItem('sentinel_session', JSON.stringify(session));

            // Show success message
            showSuccess(`Welcome back, ${user.name}!`);

            // Redirect to dashboard
            setTimeout(() => {
                window.location.href = 'sentinel-dashboard.html';
            }, 1000);
        }

        function loginAsDemo() {
            // Auto-fill demo credentials
            document.getElementById('username').value = 'demo';
            document.getElementById('password').value = 'demo123';

            // Submit form
            document.getElementById('login-form').dispatchEvent(new Event('submit'));
        }

        // Check if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            const session = localStorage.getItem('sentinel_session');
            if (session) {
                try {
                    const userData = JSON.parse(session);
                    // Check if session is still valid (less than 24 hours old)
                    const loginTime = new Date(userData.loginTime);
                    const now = new Date();
                    const hoursSinceLogin = (now - loginTime) / (1000 * 60 * 60);

                    if (hoursSinceLogin < 24) {
                        // Session still valid, redirect to dashboard
                        showSuccess('Session active. Redirecting...');
                        setTimeout(() => {
                            window.location.href = 'sentinel-dashboard.html';
                        }, 1000);
                    } else {
                        // Session expired
                        localStorage.removeItem('sentinel_session');
                    }
                } catch (e) {
                    // Invalid session data
                    localStorage.removeItem('sentinel_session');
                }
            }
        });

        // Handle Enter key in password field
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleLogin(e);
            }
        });
    </script>
</body>
</html>
