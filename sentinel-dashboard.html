<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Dashboard - Africa Railways</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1877f2;
            --secondary: #42b72a;
            --dark: #18191a;
            --surface: #242526;
            --hover: #3a3b3c;
            --border: #3e4042;
            --text-primary: #e4e6eb;
            --text-secondary: #b0b3b8;
            --gold: #FFB800;
            --success: #00d084;
            --danger: #f02849;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--dark);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-bar {
            background: var(--hover);
            border: none;
            border-radius: 20px;
            padding: 10px 16px;
            color: var(--text-primary);
            width: 240px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: var(--hover);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 20px;
            position: relative;
        }

        .icon-btn:hover {
            background: var(--border);
        }

        .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: var(--danger);
            color: white;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
        }

        /* Main Layout */
        .main-container {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 20px;
            max-width: 1920px;
            margin: 0 auto;
            padding: 20px;
        }

        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .sidebar-left, .sidebar-right {
                display: none;
            }
        }

        /* Sidebar Left */
        .sidebar-left {
            position: sticky;
            top: 80px;
            height: fit-content;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-primary);
            text-decoration: none;
            transition: background 0.2s;
        }

        .menu-item:hover {
            background: var(--hover);
        }

        .menu-item.active {
            background: var(--hover);
            font-weight: 600;
        }

        .menu-icon {
            font-size: 20px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--hover);
            border-radius: 50%;
        }

        /* Feed */
        .feed {
            max-width: 680px;
            margin: 0 auto;
        }

        .card {
            background: var(--surface);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }

        .avatar.online::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            background: var(--success);
            border: 2px solid var(--surface);
            border-radius: 50%;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            font-size: 15px;
        }

        .user-meta {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .activity-content {
            margin: 12px 0;
            font-size: 15px;
        }

        .activity-stats {
            display: flex;
            gap: 20px;
            padding: 8px 0;
            border-top: 1px solid var(--border);
            margin-top: 12px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Sidebar Right */
        .sidebar-right {
            position: sticky;
            top: 80px;
            height: fit-content;
        }

        .section-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .online-users {
            margin-bottom: 24px;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }

        .user-item:hover {
            background: var(--hover);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            position: relative;
        }

        .status-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            background: var(--success);
            border: 2px solid var(--surface);
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .user-details {
            flex: 1;
        }

        .user-name-small {
            font-size: 14px;
            font-weight: 500;
        }

        .user-status {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--surface);
            border-radius: 8px;
            padding: 16px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Activity Feed Item Types */
        .activity-type {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .type-booking {
            background: rgba(24, 119, 242, 0.2);
            color: var(--primary);
        }

        .type-payment {
            background: rgba(0, 208, 132, 0.2);
            color: var(--success);
        }

        .type-alert {
            background: rgba(240, 40, 73, 0.2);
            color: var(--danger);
        }

        .type-system {
            background: rgba(255, 184, 0, 0.2);
            color: var(--gold);
        }

        /* Real-time indicator */
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 208, 132, 0.1);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--success);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse-live 1.5s infinite;
        }

        @keyframes pulse-live {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, var(--hover) 25%, var(--border) 50%, var(--hover) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Map Container */
        .map-preview {
            background: var(--hover);
            border-radius: 8px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="logo">
                🛡️ Sentinel
            </div>
            <input type="text" class="search-bar" placeholder="Search activities, users...">
        </div>
        <div class="header-right">
            <div class="live-indicator">
                <div class="live-dot"></div>
                LIVE
            </div>
            <button class="icon-btn">
                🔔
                <span class="badge" id="notification-count">5</span>
            </button>
            <button class="icon-btn">
                ⚙️
            </button>
            <button class="icon-btn">
                👤
            </button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Left Sidebar -->
        <div class="sidebar-left">
            <a href="#" class="menu-item active">
                <div class="menu-icon">📊</div>
                <span>Dashboard</span>
            </a>
            <a href="#" class="menu-item">
                <div class="menu-icon">🎫</div>
                <span>Bookings</span>
            </a>
            <a href="#" class="menu-item">
                <div class="menu-icon">💰</div>
                <span>Payments</span>
            </a>
            <a href="#" class="menu-item">
                <div class="menu-icon">👥</div>
                <span>Users</span>
            </a>
            <a href="#" class="menu-item">
                <div class="menu-icon">🚂</div>
                <span>Routes</span>
            </a>
            <a href="#" class="menu-item">
                <div class="menu-icon">📈</div>
                <span>Analytics</span>
            </a>
            <a href="#" class="menu-item">
                <div class="menu-icon">⚠️</div>
                <span>Alerts</span>
            </a>
            <a href="#" class="menu-item">
                <div class="menu-icon">🔧</div>
                <span>Settings</span>
            </a>
        </div>

        <!-- Main Feed -->
        <div class="feed">
            <!-- Stats Overview -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="active-users">0</div>
                    <div class="stat-label">Active Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="total-bookings">0</div>
                    <div class="stat-label">Today's Bookings</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="revenue">$0</div>
                    <div class="stat-label">Revenue</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="alerts">0</div>
                    <div class="stat-label">Active Alerts</div>
                </div>
            </div>

            <!-- Activity Feed -->
            <div id="activity-feed">
                <!-- Activities will be inserted here -->
            </div>
        </div>

        <!-- Right Sidebar -->
        <div class="sidebar-right">
            <!-- Online Users -->
            <div class="online-users">
                <div class="section-title">Online Now (<span id="online-count">0</span>)</div>
                <div id="online-users-list">
                    <!-- Online users will be inserted here -->
                </div>
            </div>

            <!-- System Status -->
            <div class="card">
                <div class="section-title">System Status</div>
                <div style="font-size: 14px; color: var(--text-secondary);">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span>Backend</span>
                        <span style="color: var(--success);">● Online</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span>Database</span>
                        <span style="color: var(--success);">● Connected</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span>WebSocket</span>
                        <span style="color: var(--success);" id="ws-status">● Connected</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span>Blockchain</span>
                        <span style="color: var(--success);">● Synced</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // WebSocket connection
        let ws;
        let reconnectInterval;

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.hostname}:${window.location.port || 8080}/ws`;
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    console.log('✅ WebSocket connected');
                    document.getElementById('ws-status').innerHTML = '● Connected';
                    document.getElementById('ws-status').style.color = 'var(--success)';
                    clearInterval(reconnectInterval);
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    handleRealtimeUpdate(data);
                };

                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    document.getElementById('ws-status').innerHTML = '● Error';
                    document.getElementById('ws-status').style.color = 'var(--danger)';
                };

                ws.onclose = () => {
                    console.log('WebSocket disconnected');
                    document.getElementById('ws-status').innerHTML = '● Disconnected';
                    document.getElementById('ws-status').style.color = 'var(--text-secondary)';
                    
                    // Attempt to reconnect
                    reconnectInterval = setInterval(() => {
                        console.log('Attempting to reconnect...');
                        connectWebSocket();
                    }, 5000);
                };
            } catch (error) {
                console.error('Failed to connect WebSocket:', error);
            }
        }

        // Handle real-time updates
        function handleRealtimeUpdate(data) {
            if (data.type === 'booking') {
                addActivity({
                    type: 'booking',
                    user: data.user || 'Anonymous User',
                    content: data.message || 'New booking created',
                    timestamp: new Date(),
                    stats: {
                        route: data.route,
                        amount: data.amount
                    }
                });
                updateStats('bookings', 1);
            } else if (data.type === 'payment') {
                addActivity({
                    type: 'payment',
                    user: data.user || 'System',
                    content: data.message || 'Payment processed',
                    timestamp: new Date(),
                    stats: {
                        amount: data.amount
                    }
                });
                updateStats('revenue', data.amount || 0);
            }
        }

        // Mock data generators
        const mockUsers = [
            { name: 'John Mwamba', role: 'Passenger', location: 'Lusaka' },
            { name: 'Sarah Banda', role: 'Agent', location: 'Dar es Salaam' },
            { name: 'David Phiri', role: 'Conductor', location: 'Kapiri Mposhi' },
            { name: 'Grace Tembo', role: 'Passenger', location: 'Ndola' },
            { name: 'Peter Zulu', role: 'Station Master', location: 'Kitwe' },
            { name: 'Mary Chanda', role: 'Passenger', location: 'Kabwe' },
            { name: 'James Mulenga', role: 'Agent', location: 'Livingstone' },
            { name: 'Ruth Sakala', role: 'Passenger', location: 'Choma' }
        ];

        const mockActivities = [
            { type: 'booking', action: 'booked a ticket', route: 'Lusaka → Dar es Salaam' },
            { type: 'payment', action: 'completed payment', amount: 'ZMW 450' },
            { type: 'alert', action: 'reported an issue', details: 'Delayed departure' },
            { type: 'system', action: 'system update', details: 'Route optimization completed' }
        ];

        // Initialize online users
        function initializeOnlineUsers() {
            const container = document.getElementById('online-users-list');
            const onlineUsers = mockUsers.slice(0, 6);
            
            container.innerHTML = onlineUsers.map(user => `
                <div class="user-item">
                    <div class="user-avatar">
                        ${user.name.charAt(0)}
                        <div class="status-dot"></div>
                    </div>
                    <div class="user-details">
                        <div class="user-name-small">${user.name}</div>
                        <div class="user-status">${user.role} • ${user.location}</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('online-count').textContent = onlineUsers.length;
            document.getElementById('active-users').textContent = onlineUsers.length;
        }

        // Add activity to feed
        function addActivity(activity) {
            const feed = document.getElementById('activity-feed');
            const activityEl = document.createElement('div');
            activityEl.className = 'card';
            
            const typeClass = `type-${activity.type}`;
            const typeLabel = activity.type.charAt(0).toUpperCase() + activity.type.slice(1);
            const user = activity.user || mockUsers[Math.floor(Math.random() * mockUsers.length)].name;
            const timeAgo = formatTimeAgo(activity.timestamp || new Date());
            
            activityEl.innerHTML = `
                <div class="card-header">
                    <div class="avatar">${user.charAt(0)}</div>
                    <div class="user-info">
                        <div class="user-name">${user}</div>
                        <div class="user-meta">${timeAgo}</div>
                    </div>
                </div>
                <div class="activity-type ${typeClass}">${typeLabel}</div>
                <div class="activity-content">${activity.content}</div>
                ${activity.stats ? `
                    <div class="activity-stats">
                        ${activity.stats.route ? `<div class="stat-item">🚂 ${activity.stats.route}</div>` : ''}
                        ${activity.stats.amount ? `<div class="stat-item">💰 ${activity.stats.amount}</div>` : ''}
                    </div>
                ` : ''}
            `;
            
            feed.insertBefore(activityEl, feed.firstChild);
            
            // Keep only last 20 activities
            while (feed.children.length > 20) {
                feed.removeChild(feed.lastChild);
            }
        }

        // Update stats
        let stats = {
            users: 6,
            bookings: 0,
            revenue: 0,
            alerts: 0
        };

        function updateStats(type, value) {
            if (type === 'bookings') {
                stats.bookings += value;
                document.getElementById('total-bookings').textContent = stats.bookings;
            } else if (type === 'revenue') {
                stats.revenue += value;
                document.getElementById('revenue').textContent = `$${stats.revenue.toLocaleString()}`;
            } else if (type === 'alerts') {
                stats.alerts += value;
                document.getElementById('alerts').textContent = stats.alerts;
            }
        }

        // Format time ago
        function formatTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            return `${Math.floor(seconds / 86400)}d ago`;
        }

        // Generate mock activities
        function generateMockActivity() {
            const activity = mockActivities[Math.floor(Math.random() * mockActivities.length)];
            const user = mockUsers[Math.floor(Math.random() * mockUsers.length)];
            
            addActivity({
                type: activity.type,
                user: user.name,
                content: `${activity.action} ${activity.route || activity.details || ''}`,
                timestamp: new Date(),
                stats: activity.amount ? { amount: activity.amount } : (activity.route ? { route: activity.route } : null)
            });

            if (activity.type === 'booking') {
                updateStats('bookings', 1);
                updateStats('revenue', Math.floor(Math.random() * 500) + 100);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initializeOnlineUsers();
            
            // Generate initial activities
            for (let i = 0; i < 5; i++) {
                setTimeout(() => generateMockActivity(), i * 500);
            }
            
            // Generate new activities periodically
            setInterval(generateMockActivity, 8000);
            
            // Connect WebSocket
            connectWebSocket();
            
            // Update time ago every minute
            setInterval(() => {
                document.querySelectorAll('.user-meta').forEach(el => {
                    // Update would go here
                });
            }, 60000);
        });
    </script>
</body>
</html>
