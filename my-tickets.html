<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets - Africa Railways</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --navy: #0a0e1a;
            --gold: #FFB800;
            --cyan: #00D4FF;
            --green: #10b981;
            --surface: #16203a;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--navy);
            color: #fff;
            min-height: 100vh;
        }
        
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(10,14,26,0.95);
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--gold);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }
        
        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .nav-links a:hover { color: var(--gold); }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .page-header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--gold) 0%, var(--cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .page-header p {
            color: #94a3b8;
        }
        
        .search-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid #1e293b;
            margin-bottom: 30px;
        }
        
        .search-card h2 {
            color: var(--gold);
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        
        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(255, 184, 0, 0.1);
        }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold) 0%, #ff9500 100%);
            border: none;
            border-radius: 10px;
            color: var(--navy);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 184, 0, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .tickets-section {
            margin-top: 30px;
        }
        
        .ticket-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #1e293b;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .ticket-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--green);
        }
        
        .ticket-card.used::before {
            background: #64748b;
        }
        
        .ticket-card.cancelled::before {
            background: #ef4444;
        }
        
        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        
        .ticket-ref {
            font-size: 0.85rem;
            color: #64748b;
        }
        
        .ticket-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .ticket-status.confirmed {
            background: rgba(16, 185, 129, 0.2);
            color: var(--green);
        }
        
        .ticket-status.used {
            background: rgba(100, 116, 139, 0.2);
            color: #64748b;
        }
        
        .ticket-status.cancelled {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .ticket-route {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 15px;
        }
        
        .ticket-route i {
            color: var(--gold);
            margin: 0 10px;
        }
        
        .ticket-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            padding-top: 15px;
            border-top: 1px solid #1e293b;
        }
        
        .detail-item {
            text-align: center;
        }
        
        .detail-label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        
        .detail-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
        }
        
        .route-info {
            background: #0f172a;
            border-radius: 8px;
            padding: 12px;
            margin: 15px 0;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        
        .route-info i {
            color: var(--cyan);
            margin-top: 2px;
        }
        
        .route-info-text {
            color: #94a3b8;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        
        .qr-section {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #334155;
        }
        
        .qr-code {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 10px;
        }
        
        .qr-hint {
            font-size: 0.8rem;
            color: #64748b;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .empty-state h3 {
            color: #fff;
            margin-bottom: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 184, 0, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        
        .alert-info {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
        }
        
        .railway-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 10px;
        }
        
        .railway-badge.zrl {
            background: rgba(0, 107, 63, 0.2);
            color: #10b981;
        }
        
        .railway-badge.tazara {
            background: rgba(255, 184, 0, 0.2);
            color: var(--gold);
        }
        
        footer {
            text-align: center;
            padding: 30px;
            color: #64748b;
            font-size: 0.9rem;
            border-top: 1px solid #1e293b;
            margin-top: 60px;
        }
        
        footer a { color: var(--gold); text-decoration: none; }
        
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .ticket-details { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo"><i class="bi bi-train-front"></i> Africa Railways</a>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/zambia-railways.html">Zambia Railways</a></li>
            <li><a href="/tazara-pilot.html">TAZARA</a></li>
            <li><a href="/book-tickets.html">Book Tickets</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1><i class="bi bi-ticket-perforated"></i> My Tickets</h1>
            <p>Retrieve your booked tickets using your phone number</p>
        </div>

        <div class="search-card">
            <h2><i class="bi bi-search"></i> Find Your Tickets</h2>
            <form id="searchForm" onsubmit="searchTickets(event)">
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="+260 97X XXX XXX" required>
                </div>
                <button type="submit" class="btn-primary" id="searchBtn">
                    <span id="searchBtnText">Search Tickets</span>
                </button>
            </form>
        </div>

        <div id="alertContainer"></div>

        <div id="ticketsSection" class="tickets-section" style="display: none;">
            <h2 style="color: var(--gold); margin-bottom: 20px;">
                <i class="bi bi-collection"></i> Your Tickets
                <span id="ticketCount" style="font-size: 0.9rem; color: #64748b;"></span>
            </h2>
            <div id="ticketsList"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Africa Railways. All rights reserved.</p>
        <p><a href="/privacy-policy.html">Privacy Policy</a> | <a href="/terms-of-service.html">Terms of Service</a></p>
    </footer>

    <script src="/js/config.js"></script>
    <script>
        // Supabase configuration
        const SUPABASE_URL = window.SUPABASE_URL || 'https://llvprbmrnjvamjzavmhg.supabase.co';
        const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || '';
        let supabaseClient = null;

        async function getSupabase() {
            if (supabaseClient) return supabaseClient;
            if (typeof supabase !== 'undefined' && SUPABASE_ANON_KEY) {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
            return supabaseClient;
        }

        function showAlert(message, type = 'info') {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => container.innerHTML = '', 5000);
        }

        function formatPhone(phone) {
            // Normalize phone number
            let cleaned = phone.replace(/\D/g, '');
            if (cleaned.startsWith('0')) {
                cleaned = '260' + cleaned.substring(1);
            }
            if (!cleaned.startsWith('260')) {
                cleaned = '260' + cleaned;
            }
            return '+' + cleaned;
        }

        async function searchTickets(event) {
            event.preventDefault();
            
            const phone = document.getElementById('phone').value.trim();
            const searchBtn = document.getElementById('searchBtn');
            const searchBtnText = document.getElementById('searchBtnText');
            const ticketsSection = document.getElementById('ticketsSection');
            const ticketsList = document.getElementById('ticketsList');
            
            if (!phone) {
                showAlert('Please enter your phone number', 'error');
                return;
            }

            // Show loading
            searchBtn.disabled = true;
            searchBtnText.innerHTML = '<span class="spinner" style="width: 20px; height: 20px; display: inline-block; vertical-align: middle; margin-right: 10px;"></span> Searching...';
            ticketsSection.style.display = 'none';

            try {
                const client = await getSupabase();
                if (!client) {
                    showAlert('Database connection not configured. Please contact support.', 'error');
                    return;
                }

                const normalizedPhone = formatPhone(phone);
                
                // Search for tickets by phone number
                const { data: tickets, error } = await client
                    .from('bookings')
                    .select('*')
                    .or(`passenger_phone.eq.${normalizedPhone},passenger_phone.eq.${phone}`)
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error('Search error:', error);
                    showAlert('Failed to search tickets. Please try again.', 'error');
                    return;
                }

                if (!tickets || tickets.length === 0) {
                    ticketsList.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-ticket-perforated"></i>
                            <h3>No Tickets Found</h3>
                            <p>We couldn't find any tickets for this phone number.</p>
                            <p style="margin-top: 15px;">
                                <a href="/zambia-railways.html" style="color: var(--gold);">Book a ticket now →</a>
                            </p>
                        </div>
                    `;
                    ticketsSection.style.display = 'block';
                    return;
                }

                // Display tickets
                document.getElementById('ticketCount').textContent = `(${tickets.length} found)`;
                ticketsList.innerHTML = tickets.map(ticket => renderTicket(ticket)).join('');
                ticketsSection.style.display = 'block';

            } catch (err) {
                console.error('Search error:', err);
                showAlert('An error occurred. Please try again.', 'error');
            } finally {
                searchBtn.disabled = false;
                searchBtnText.textContent = 'Search Tickets';
            }
        }

        function renderTicket(ticket) {
            const status = ticket.booking_status || 'confirmed';
            const railway = ticket.metadata?.railway || 'ZRL';
            const departureTime = ticket.departure_time || ticket.metadata?.departureTime || '08:00';
            const arrivalTime = ticket.arrival_time || ticket.metadata?.arrivalTime || '18:00';
            const arrivalDay = ticket.metadata?.arrivalDay || '';
            
            const fromStation = ticket.from_station || ticket.route?.split(' → ')[0] || '';
            const toStation = ticket.to_station || ticket.route?.split(' → ')[1] || '';
            
            const travelDate = new Date(ticket.travel_date).toLocaleDateString('en-GB', {
                weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
            });
            
            const price = ticket.local_currency === 'ZMW' 
                ? `K ${ticket.total_price_local?.toLocaleString() || '0'}`
                : `$${ticket.total_price_usd?.toFixed(2) || '0'}`;

            return `
                <div class="ticket-card ${status}">
                    <div class="ticket-header">
                        <div>
                            <span class="ticket-ref">Ref: ${ticket.booking_ref}</span>
                            <span class="railway-badge ${railway.toLowerCase()}">${railway}</span>
                        </div>
                        <span class="ticket-status ${status}">${status}</span>
                    </div>
                    
                    <div class="ticket-route">
                        ${fromStation} <i class="bi bi-arrow-right"></i> ${toStation}
                    </div>
                    
                    <div class="route-info">
                        <i class="bi bi-info-circle"></i>
                        <span class="route-info-text">
                            Departs from <strong>${fromStation}</strong> on ${travelDate} at ${departureTime}. 
                            Arrives at <strong>${toStation}</strong>${arrivalDay ? ' on ' + arrivalDay : ''} at ${arrivalTime}.
                        </span>
                    </div>
                    
                    <div class="ticket-details">
                        <div class="detail-item">
                            <div class="detail-label">Date</div>
                            <div class="detail-value">${travelDate}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Departure</div>
                            <div class="detail-value">${departureTime}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Class</div>
                            <div class="detail-value">${ticket.class || 'Economy'}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Passengers</div>
                            <div class="detail-value">${ticket.passengers || 1}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Price</div>
                            <div class="detail-value" style="color: var(--gold);">${price}</div>
                        </div>
                    </div>
                    
                    <div class="qr-section">
                        <div class="qr-code">
                            <svg viewBox="0 0 100 100" width="80" height="80">
                                <rect fill="#fff" width="100" height="100"/>
                                <text x="50" y="50" text-anchor="middle" font-size="6" fill="#333">${ticket.booking_ref}</text>
                                <rect x="20" y="20" width="15" height="15" fill="#333"/>
                                <rect x="65" y="20" width="15" height="15" fill="#333"/>
                                <rect x="20" y="65" width="15" height="15" fill="#333"/>
                                <rect x="40" y="40" width="20" height="20" fill="#333"/>
                            </svg>
                        </div>
                        <div class="qr-hint">Show this QR code to the conductor</div>
                    </div>
                </div>
            `;
        }

        // Auto-fill phone from localStorage if available
        document.addEventListener('DOMContentLoaded', () => {
            const savedPhone = localStorage.getItem('africa_railways_phone');
            if (savedPhone) {
                document.getElementById('phone').value = savedPhone;
            }
        });

        // Save phone for future use
        document.getElementById('phone').addEventListener('change', (e) => {
            localStorage.setItem('africa_railways_phone', e.target.value);
        });
    </script>
</body>
</html>
