<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Admin | Africa Railways</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0a0e1a; --surface: #141b2d; --gold: #f4b41a; --cyan: #00d4ff; --text: #e0e0e0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        h1 { color: var(--gold); margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        .subtitle { color: #666; margin-bottom: 25px; }
        .card { background: var(--surface); border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid #333; }
        .card h2 { color: var(--cyan); margin-bottom: 15px; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
        .templates { display: grid; gap: 8px; }
        .template-btn { background: #1a2540; border: 1px solid #333; padding: 12px 15px; border-radius: 8px; text-align: left; cursor: pointer; color: var(--text); transition: all 0.2s; display: flex; align-items: center; gap: 10px; }
        .template-btn:hover { border-color: var(--gold); background: #1f2d4a; }
        .template-btn i { color: var(--gold); width: 20px; }
        textarea { width: 100%; padding: 15px; background: #0a0e1a; border: 1px solid #333; border-radius: 8px; color: var(--text); font-size: 0.95rem; min-height: 200px; resize: vertical; font-family: inherit; line-height: 1.5; }
        textarea:focus { outline: none; border-color: var(--cyan); }
        .char-count { text-align: right; font-size: 0.8rem; color: #666; margin-top: 5px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; margin-top: 10px; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-gold:hover { background: #e0a800; transform: translateY(-1px); }
        .btn-dark { background: #333; color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .status { padding: 12px 15px; border-radius: 8px; margin-top: 15px; display: none; }
        .status.show { display: flex; align-items: center; gap: 10px; }
        .status.success { background: rgba(0,255,100,0.1); border: 1px solid #0f0; color: #0f0; }
        .status.error { background: rgba(255,0,0,0.1); border: 1px solid #f00; color: #f00; }
        .status.sending { background: rgba(0,212,255,0.1); border: 1px solid var(--cyan); color: var(--cyan); }
        .recent { margin-top: 10px; }
        .recent-item { padding: 10px; background: #0a0e1a; border-radius: 6px; margin-top: 8px; font-size: 0.85rem; }
        .recent-item .time { color: #666; font-size: 0.75rem; }
        .preview { background: #0a0e1a; border-radius: 8px; padding: 15px; margin-top: 15px; white-space: pre-wrap; line-height: 1.6; font-size: 0.9rem; }
        .preview-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .preview-header img { width: 35px; height: 35px; border-radius: 50%; background: var(--gold); }
        .preview-header span { font-weight: 600; }
        a { color: var(--cyan); }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fab fa-telegram"></i> Telegram Admin</h1>
        <p class="subtitle">Post to @afrcsentinel</p>

        <div class="card">
            <h2><i class="fas fa-file-alt"></i> Quick Templates</h2>
            <div class="templates">
                <button class="template-btn" onclick="useTemplate('idoLive')">
                    <i class="fas fa-rocket"></i> IDO Live Announcement
                </button>
                <button class="template-btn" onclick="useTemplate('countdown')">
                    <i class="fas fa-clock"></i> Countdown Reminder
                </button>
                <button class="template-btn" onclick="useTemplate('tokenDifference')">
                    <i class="fas fa-coins"></i> AFC vs AFRC vs SENT
                </button>
                <button class="template-btn" onclick="useTemplate('whyInvest')">
                    <i class="fas fa-gem"></i> Why Invest in SENT
                </button>
                <button class="template-btn" onclick="useTemplate('howToBuy')">
                    <i class="fas fa-shopping-cart"></i> How to Buy
                </button>
            </div>
        </div>

        <div class="card">
            <h2><i class="fas fa-edit"></i> Compose Message</h2>
            <textarea id="message" placeholder="Write your message here... (Supports *bold* and _italic_)"></textarea>
            <div class="char-count"><span id="charCount">0</span> characters</div>
            
            <button class="btn btn-gold" onclick="sendMessage()" id="sendBtn">
                <i class="fab fa-telegram"></i> Post to Telegram
            </button>
            <button class="btn btn-dark" onclick="previewMessage()">
                <i class="fas fa-eye"></i> Preview
            </button>
            
            <div class="status" id="status"></div>
            
            <div class="preview" id="preview" style="display:none;">
                <div class="preview-header">
                    <div style="width:35px;height:35px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;color:#000;font-weight:bold;">AR</div>
                    <span>Africa Railways Bot</span>
                </div>
                <div id="previewContent"></div>
            </div>
        </div>

        <div class="card">
            <h2><i class="fas fa-history"></i> Recent Posts</h2>
            <div class="recent" id="recentPosts">
                <p style="color:#666;">No posts yet this session</p>
            </div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = '8524648377:AAFN2HGhkpkEWcuQGf7N1gpEPtItaLN2bJk';
        const CHAT_ID = '@afrcsentinel';
        
        const templates = {
            idoLive: `🚀 *SENT IDO IS LIVE ON PINKSALE!*

🛤️ Sentinel ($SENT) - Africa Railways Investment Token

💰 Price: $0.00005 per SENT
🔒 730-day liquidity lock
⛓️ Network: Polygon

👉 https://www.pinksale.finance/launchpad/polygon/0xf366e3aaCC54C99E50c90B7C57625776f88D8d08

#SENT #PinkSale #IDO #Polygon`,

            countdown: `⏰ *IDO COUNTDOWN REMINDER*

SENT IDO ends *January 26, 2026* at 14:00 UTC!

Don't miss your chance to invest in Africa's railway future!

👉 https://www.pinksale.finance/launchpad/polygon/0xf366e3aaCC54C99E50c90B7C57625776f88D8d08`,

            tokenDifference: `🔄 *AFC vs AFRC vs SENT - What's the Difference?*

*AFC (Africoin)*
🎫 The ticketing token
• Used for buying train tickets
• Runs on Sui blockchain
• For daily passenger transactions

*AFRC (Africa Railways Coin)*
🏛️ The ecosystem token
• Represents the Africa Railways brand
• Community rewards & incentives

*SENT (Sentinel)*
💎 The investment token
• Powers railway infrastructure
• Runs 2,000+ signaling nodes
• Governance & voting rights
• Currently in IDO on PinkSale

Three tokens, one mission: Connecting Africa by rail! 🚂`,

            whyInvest: `💎 *WHY INVEST IN SENTINEL ($SENT)?*

✅ *Real Infrastructure* - Backing African High Speed Railways
✅ *Utility* - Powers 2,000+ signaling worker nodes
✅ *Security* - 730-day liquidity lock
✅ *Governance* - Network decision-making rights

This isn't just crypto - it's infrastructure investment.

👉 https://www.pinksale.finance/launchpad/polygon/0xf366e3aaCC54C99E50c90B7C57625776f88D8d08`,

            howToBuy: `📖 *HOW TO BUY SENT*

1️⃣ Get MetaMask or Trust Wallet
2️⃣ Add Polygon network
3️⃣ Buy MATIC and send to your wallet
4️⃣ Go to PinkSale link below
5️⃣ Connect wallet & contribute

👉 https://www.pinksale.finance/launchpad/polygon/0xf366e3aaCC54C99E50c90B7C57625776f88D8d08

Need help? Ask in this group!`
        };

        const recentPosts = [];

        function useTemplate(name) {
            document.getElementById('message').value = templates[name];
            updateCharCount();
            previewMessage();
        }

        function updateCharCount() {
            const count = document.getElementById('message').value.length;
            document.getElementById('charCount').textContent = count;
        }

        document.getElementById('message').addEventListener('input', updateCharCount);

        function previewMessage() {
            const message = document.getElementById('message').value;
            const preview = document.getElementById('preview');
            const content = document.getElementById('previewContent');
            
            // Simple markdown to HTML conversion
            let html = message
                .replace(/\*(.*?)\*/g, '<strong>$1</strong>')
                .replace(/_(.*?)_/g, '<em>$1</em>')
                .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
            
            content.innerHTML = html;
            preview.style.display = 'block';
        }

        async function sendMessage() {
            const message = document.getElementById('message').value.trim();
            if (!message) {
                showStatus('Please enter a message', 'error');
                return;
            }

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            showStatus('Posting to Telegram...', 'sending');

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown',
                        disable_web_page_preview: false
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    showStatus('✅ Message posted successfully!', 'success');
                    addRecentPost(message);
                    document.getElementById('message').value = '';
                    document.getElementById('preview').style.display = 'none';
                    updateCharCount();
                } else {
                    showStatus('❌ Error: ' + data.description, 'error');
                }
            } catch (error) {
                showStatus('❌ Network error: ' + error.message, 'error');
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fab fa-telegram"></i> Post to Telegram';
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.innerHTML = message;
            status.className = 'status show ' + type;
        }

        function addRecentPost(message) {
            const time = new Date().toLocaleTimeString();
            const preview = message.substring(0, 50) + (message.length > 50 ? '...' : '');
            recentPosts.unshift({ time, preview });
            
            const container = document.getElementById('recentPosts');
            container.innerHTML = recentPosts.slice(0, 5).map(p => `
                <div class="recent-item">
                    <div class="time">${p.time}</div>
                    <div>${p.preview}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
