            const subscriptionCost = tier ? tier.monthlyPrice : 0;
            const totalCost = finalPrice + subscriptionCost;
            
            // Currency conversions (approximate rates)
            const TZS_RATE = 2500; // 1 USD = ~2500 TZS
            const ZMW_RATE = 25;   // 1 USD = ~25 ZMW
            const basePriceTZS = Math.round(basePrice * TZS_RATE);
            const basePriceZMW = Math.round(basePrice * ZMW_RATE);
            const serviceChargeTZS = Math.round(serviceCharge * TZS_RATE);
            const serviceChargeZMW = Math.round(serviceCharge * ZMW_RATE);
            const totalCostTZS = Math.round(totalCost * TZS_RATE);
            const totalCostZMW = Math.round(totalCost * ZMW_RATE);
            const stakingRewards = tier ? tier.stakingReward : 0;

                    from: route.from,
                    to: route.to,

                    price: `${totalCost.toFixed(2)} $AFC`,
                    priceTZS: `TZS ${totalCostTZS.toLocaleString()}`,
                    priceZMW: `ZMW ${totalCostZMW.toLocaleString()}`,

                                </div>

                                {/* Phone Number for non-logged-in users */}
                                {!isLoggedIn && (
                                    <div style={{ marginBottom: '20px' }}>
                                        <label style={{ display: 'block', marginBottom: '8px', color: '#94a3b8' }}>
                                            📱 Phone Number <span style={{ color: 'var(--gold)', fontSize: '0.8rem' }}>(creates your SUI/$AFC wallet)</span>
                                        </label>
                                        <input 
                                            type="tel" 
                                            value={phoneNumber} 
                                            onChange={(e) => setPhoneNumber(e.target.value)}
                                            placeholder="+260 97X XXX XXX"
                                            style={{
                                                width: '100%',
                                                padding: '12px',
                                                background: phoneNumber ? 'rgba(16, 185, 129, 0.1)' : 'rgba(255, 255, 255, 0.05)',
                                                border: phoneNumber ? '1px solid var(--green)' : '1px solid #333',
                                                borderRadius: '8px',
                                                color: 'white',
                                                fontSize: '1rem'
                                            }}
                                        />
                                        <div style={{ fontSize: '0.8rem', color: '#94a3b8', marginTop: '5px' }}>
                                            Your NFT ticket & wallet will be linked to this number. SMS confirmation will be sent.
                                        </div>
                                    </div>
                                )}

                                {route && (
                                    <>
                                        <div className="summary-item">
                                            <span>Route</span>
                                            <span style={{ textAlign: 'right' }}>{route.name}</span>
                                        </div>
                                        <div className="summary-item">
                                            <span>Trip Type</span>
                                            <span style={{ color: isReturnTrip ? 'var(--gold)' : '#94a3b8' }}>
                                                {isReturnTrip ? '🔄 Return Trip' : '➡️ One Way'}
                                            </span>
                                        </div>
                                        <div className="summary-item">
                                            <span>Passengers</span>
                                            <span>{passengers}</span>
                                        </div>
                                        <div className="summary-item">
                                            <span>Base Price {isReturnTrip && '(10% off)'}</span>
                                            <span>${basePrice.toFixed(2)} $AFC</span>
                                        </div>
                                        <div className="summary-item">
                                            <span>Service Charge (10%)</span>
                                            <span>${serviceCharge.toFixed(2)} $AFC</span>
                                        </div>
                                        <div className="summary-item">
                                            <span>Subscription</span>
                                            <span>{tier.name} (${subscriptionCost}/mo)</span>
                                        </div>
                                        <div className="summary-item">
                                            <span>Discount ({tier.discount}%)</span>
                                            <span style={{ color: 'var(--green)' }}>-${discount.toFixed(2)} $AFC</span>
                                        </div>
                                        <div className="summary-item">
                                            <span>Staking APY</span>
                                            <span style={{ color: 'var(--purple)' }}>{stakingRewards}%</span>
                                        </div>
                                        <div className="summary-item">
                                            <span>Total</span>
                                            <span>${totalCost.toFixed(2)} $AFC</span>
                                        </div>
                                        <div className="summary-item" style={{ fontSize: '0.85rem', color: '#94a3b8' }}>
                                            <span>≈ TZS</span>
                                            <span>{totalCostTZS.toLocaleString()}</span>
                                        </div>
                                        <div className="summary-item" style={{ fontSize: '0.85rem', color: '#94a3b8' }}>
                                            <span>≈ ZMW</span>
                                            <span>{totalCostZMW.toLocaleString()}</span>
                                        </div>
                                    </>
                                )}

                                {!route && (
                                    <p style={{ color: '#94a3b8', textAlign: 'center', padding: '20px' }}>
                                        Select a route to see the summary
                                    </p>
                                )}

                                {/* Payment Method Selector */}
                                {route && (
                                    <div style={{ marginBottom: '15px' }}>
                                        <label style={{ display: 'block', marginBottom: '10px', color: '#94a3b8', fontSize: '0.9rem' }}>
                                            Payment Method:
                                        </label>
                                        <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                                            <button type="button" onClick={() => setPaymentMethod('card')}
                                                style={{
                                                    flex: '1', padding: '10px', borderRadius: '8px', cursor: 'pointer', fontSize: '0.85rem', fontWeight: '600',
                                                    background: paymentMethod === 'card' ? 'linear-gradient(135deg, #6366f1, #4f46e5)' : 'rgba(255,255,255,0.1)',
                                                    border: paymentMethod === 'card' ? '2px solid #818cf8' : '1px solid #333', color: 'white'
                                                }}>💳 Card</button>
                                            <button type="button" onClick={() => setPaymentMethod('crypto')}
                                                style={{
                                                    flex: '1', padding: '10px', borderRadius: '8px', cursor: 'pointer', fontSize: '0.85rem', fontWeight: '600',
                                                    background: paymentMethod === 'crypto' ? 'linear-gradient(135deg, var(--gold), #f59e0b)' : 'rgba(255,255,255,0.1)',
                                                    border: paymentMethod === 'crypto' ? '2px solid var(--gold)' : '1px solid #333', color: paymentMethod === 'crypto' ? 'var(--navy)' : 'white'
                                                }}>🪙 AFC</button>
                                            <button type="button" onClick={() => setPaymentMethod('mobile')}
                                                style={{
                                                    flex: '1', padding: '10px', borderRadius: '8px', cursor: 'pointer', fontSize: '0.85rem', fontWeight: '600',
                                                    background: paymentMethod === 'mobile' ? 'linear-gradient(135deg, #10b981, #059669)' : 'rgba(255,255,255,0.1)',
                                                    border: paymentMethod === 'mobile' ? '2px solid #34d399' : '1px solid #333', color: 'white'
                                                }}>📱 Mobile</button>
                                        </div>
                                    </div>
                                )}

                                <button 
                                    className="book-button"
                                    onClick={handleBooking}
                                    disabled={!route || isBooking || stripeLoading || (paymentMethod !== 'card' && !isLoggedIn && !phoneNumber)}
                                >
                                    {isBooking || stripeLoading ? '⏳ Processing...' : paymentMethod === 'card' ? `💳 Pay $${totalCost.toFixed(2)}` : `Book & Stake - $${totalCost.toFixed(2)} $AFC`}
                                </button>

                                {!isLoggedIn && !phoneNumber && route && (
                                    <div style={{ fontSize: '0.85rem', color: '#f59e0b', textAlign: 'center', marginTop: '10px' }}>
                                        ⚠️ Please enter your phone number to continue
                                    </div>
                                )}

                                {status && (
                                    <div className={`status-message ${status.split(':')[0]}`}>
                                        {status.split(':')[1].split('\\n').map((line, i) => (
                                            <div key={i}>{line}</div>
                                        ))}
                                    </div>
                                )}

                                {/* Download Ticket Button */}
                                {ticketData && (
                                    <div style={{ marginTop: '15px' }}>
                                        <button 
                                            onClick={downloadTicket}
                                            style={{
                                                width: '100%',
                                                padding: '14px',
                                                background: 'linear-gradient(135deg, #00D4FF 0%, #0099cc 100%)',
                                                color: 'white',
                                                border: 'none',
                                                borderRadius: '10px',
                                                fontSize: '1rem',
                                                fontWeight: 'bold',
                                                cursor: 'pointer',
                                                display: 'flex',
                                                alignItems: 'center',
                                                justifyContent: 'center',
                                                gap: '10px'
                                            }}
                                        >
                                            📥 Download NFT Ticket
                                        </button>
                                        <div style={{ fontSize: '0.8rem', color: '#94a3b8', textAlign: 'center', marginTop: '8px' }}>
                                            NFT ID: {ticketData.nftId} • IPFS: {ticketData.ipfsHash?.slice(0, 12)}...
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TazaraPilot />);
        
        // Send email notification for TAZARA booking
        async function sendTazaraEmailNotification(booking) {
            try {
                const emailHtml = `
                    <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
                        <div style="background: linear-gradient(135deg, #1a2642, #16203a); color: white; padding: 20px; text-align: center;">
                            <h1 style="margin: 0; color: #FFB800;">🚂 New TAZARA Booking</h1>
                        </div>
                        <div style="padding: 20px; background: #f5f5f5;">
                            <h2 style="color: #1a2642; margin-top: 0;">Reference: ${booking.bookingRef}</h2>
                            <table style="width: 100%; border-collapse: collapse;">
                                <tr><td style="padding: 10px; border-bottom: 1px solid #ddd;"><strong>Route:</strong></td><td style="padding: 10px; border-bottom: 1px solid #ddd;">${booking.route}</td></tr>
                                <tr><td style="padding: 10px; border-bottom: 1px solid #ddd;"><strong>From:</strong></td><td style="padding: 10px; border-bottom: 1px solid #ddd;">${booking.from}</td></tr>
                                <tr><td style="padding: 10px; border-bottom: 1px solid #ddd;"><strong>To:</strong></td><td style="padding: 10px; border-bottom: 1px solid #ddd;">${booking.to}</td></tr>
                                <tr><td style="padding: 10px; border-bottom: 1px solid #ddd;"><strong>Passengers:</strong></td><td style="padding: 10px; border-bottom: 1px solid #ddd;">${booking.passengers}</td></tr>
                                <tr><td style="padding: 10px; border-bottom: 1px solid #ddd;"><strong>Class:</strong></td><td style="padding: 10px; border-bottom: 1px solid #ddd;">${booking.class}</td></tr>
                                <tr><td style="padding: 10px; border-bottom: 1px solid #ddd;"><strong>Base Fare:</strong></td><td style="padding: 10px; border-bottom: 1px solid #ddd;">$${booking.basePrice} AFC</td></tr>
                                <tr><td style="padding: 10px; border-bottom: 1px solid #ddd;"><strong>Service Charge (10%):</strong></td><td style="padding: 10px; border-bottom: 1px solid #ddd;">$${booking.serviceCharge} AFC</td></tr>
                                <tr style="background: #1a2642; color: white;"><td style="padding: 10px;"><strong>Total:</strong></td><td style="padding: 10px;"><strong>$${booking.totalAFC} AFC</strong></td></tr>
                                <tr><td style="padding: 10px; border-bottom: 1px solid #ddd;"><strong>≈ TZS:</strong></td><td style="padding: 10px; border-bottom: 1px solid #ddd;">TZS ${booking.totalTZS}</td></tr>
                                <tr><td style="padding: 10px; border-bottom: 1px solid #ddd;"><strong>≈ ZMW:</strong></td><td style="padding: 10px; border-bottom: 1px solid #ddd;">ZMW ${booking.totalZMW}</td></tr>
                                <tr><td style="padding: 10px; border-bottom: 1px solid #ddd;"><strong>Phone:</strong></td><td style="padding: 10px; border-bottom: 1px solid #ddd;">${booking.phone || 'N/A'}</td></tr>
                                <tr><td style="padding: 10px; border-bottom: 1px solid #ddd;"><strong>Wallet:</strong></td><td style="padding: 10px; border-bottom: 1px solid #ddd; font-size: 10px;">${booking.wallet}</td></tr>
                            </table>
                            <p style="margin-top: 20px; color: #666; font-size: 12px;">Booked at: ${booking.timestamp}</p>
                        </div>
                        <div style="background: #333; color: white; padding: 15px; text-align: center; font-size: 12px;">Africa Railways - TAZARA Pilot Program</div>
                    </div>
                `;
                
                await fetch('/api/email/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        to: 'admin@africarailways.com',
                        subject: `[TAZARA] New Booking: ${booking.bookingRef} - ${booking.from} to ${booking.to}`,
                        html: emailHtml
                    })
                });
                console.log('Admin email sent for TAZARA booking:', booking.bookingRef);
            } catch (error) {
                console.error('Failed to send TAZARA email:', error);
            }
        }
        
        // Post TAZARA booking to Sentinel dashboard
        async function postTazaraToSentinel(booking) {
            try {
                const sentinelBookings = JSON.parse(localStorage.getItem('sentinel_bookings') || '[]');
                sentinelBookings.unshift({
                    id: booking.bookingRef,
                    type: 'booking',
                    operator: 'TAZARA',
                    operatorName: 'Tanzania-Zambia Railway Authority',
                    user: booking.phone || 'Wallet User',
                    route: `${booking.from} → ${booking.to}`,
                    amount: booking.amount,
                    amountTZS: booking.amountTZS,
                    amountZMW: booking.amountZMW,
                    currency: 'AFC',
                    status: 'confirmed',
                    timestamp: booking.timestamp,
                    message: `New TAZARA booking: ${booking.from} to ${booking.to} - ${booking.amount}`
                });
                if (sentinelBookings.length > 100) sentinelBookings.pop();
                localStorage.setItem('sentinel_bookings', JSON.stringify(sentinelBookings));
                
                try {
                    await fetch('/api/sentinel/booking', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            type: 'booking',
                            operator: 'TAZARA',
                            user: booking.phone || 'Wallet User',
                            route: `${booking.from} → ${booking.to}`,
                            amount: booking.amount,
                            bookingRef: booking.bookingRef,
                            message: `New TAZARA booking: ${booking.route}`
                        })
                    });
                } catch (apiError) { }
                
                console.log('TAZARA booking posted to Sentinel:', booking.bookingRef);
            } catch (error) {
                console.error('Failed to post TAZARA to Sentinel:', error);
            }
        }
    </script>
</body>
</html>
