<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Sentinel Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1877f2;
            --secondary: #42b72a;
            --dark: #18191a;
            --surface: #242526;
            --hover: #3a3b3c;
            --border: #3e4042;
            --text-primary: #e4e6eb;
            --text-secondary: #b0b3b8;
            --gold: #FFB800;
            --success: #00d084;
            --danger: #f02849;
            --warning: #FFA500;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--dark);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-bar {
            background: var(--hover);
            border: none;
            border-radius: 20px;
            padding: 10px 16px;
            color: var(--text-primary);
            width: 240px;
        }

        .main-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            max-width: 100%;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }

        .sidebar-left {
            position: sticky;
            top: 80px;
            height: fit-content;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-primary);
            text-decoration: none;
            transition: background 0.2s;
        }

        .menu-item:hover {
            background: var(--hover);
        }

        .menu-item.active {
            background: var(--hover);
            font-weight: 600;
        }

        .menu-icon {
            font-size: 20px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--hover);
            border-radius: 50%;
        }

        .notification-badge {
            margin-left: auto;
            background: var(--danger);
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        .content {
            max-width: 100%;
            width: 100%;
        }

        .icon-btn {
            background: var(--hover);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 20px;
            position: relative;
        }

        .icon-btn:hover {
            background: var(--border);
        }

        .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: var(--danger);
            color: white;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 208, 132, 0.1);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--success);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse-live 1.5s infinite;
        }

        @keyframes pulse-live {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .page-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .sidebar-left {
                display: none;
            }
        }

        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            background: var(--hover);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 20px;
            text-decoration: none;
        }

        .back-btn:hover {
            background: var(--border);
        }

        .page-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-btn {
            padding: 8px 16px;
            background: var(--hover);
            border: none;
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .header-btn:hover {
            background: var(--border);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        .toolbar {
            background: var(--surface);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .toolbar-btn {
            padding: 8px 12px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .toolbar-btn:hover {
            background: var(--hover);
            color: var(--text-primary);
        }

        .toolbar-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: var(--border);
        }

        .search-box {
            flex: 1;
            background: var(--hover);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border);
        }

        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
            margin-bottom: -2px;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .notification-list {
            background: var(--surface);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .notification-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }

        .notification-item:last-child {
            border-bottom: none;
        }

        .notification-item:hover {
            background: var(--hover);
        }

        .notification-item.unread {
            background: rgba(24, 119, 242, 0.05);
        }

        .notification-item.selected {
            background: rgba(24, 119, 242, 0.1);
        }

        .notification-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .icon-alert {
            background: rgba(240, 40, 73, 0.2);
        }

        .icon-maintenance {
            background: rgba(255, 165, 0, 0.2);
        }

        .icon-booking {
            background: rgba(24, 119, 242, 0.2);
        }

        .icon-system {
            background: rgba(0, 208, 132, 0.2);
        }

        .notification-content {
            flex: 1;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 4px;
        }

        .notification-title {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
        }

        .notification-time {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .notification-message {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .notification-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .action-link {
            font-size: 13px;
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
        }

        .action-link:hover {
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-message {
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .toolbar {
                flex-wrap: wrap;
            }

            .search-box {
                width: 100%;
                order: 3;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="logo">
                🛡️ Sentinel Dashboard
            </div>
            <input type="text" class="search-bar" placeholder="Search activities, users..." style="width: 200px;">
        </div>
        <div class="header-right">
            <div class="live-indicator">
                <div class="live-dot"></div>
                LIVE
            </div>
            <button class="icon-btn" title="Notifications">
                🔔
                <span class="badge">3</span>
            </button>
            <button class="icon-btn" onclick="window.location.href='settings.html'" title="Settings">
                ⚙️
            </button>
            <button class="icon-btn" onclick="openProfile()" title="Profile">
                👤
            </button>
            <button class="icon-btn" onclick="logout()" title="Logout" style="background: var(--danger);">
                🚪
            </button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Left Sidebar -->
        <div class="sidebar-left">
            <a href="../sentinel-dashboard.html" class="menu-item">
                <div class="menu-icon">📊</div>
                <span>Dashboard</span>
            </a>
            <a href="bookings.html" class="menu-item">
                <div class="menu-icon">🎫</div>
                <span>Bookings</span>
            </a>
            <a href="payments.html" class="menu-item">
                <div class="menu-icon">💰</div>
                <span>Payments</span>
            </a>
            <a href="users.html" class="menu-item">
                <div class="menu-icon">👥</div>
                <span>Users</span>
            </a>
            <a href="routes.html" class="menu-item">
                <div class="menu-icon">🚂</div>
                <span>Routes</span>
            </a>
            <a href="rolling-stock.html" class="menu-item">
                <div class="menu-icon">🚃</div>
                <span>Rolling Stock</span>
            </a>
            <a href="maintenance.html" class="menu-item">
                <div class="menu-icon">🔧</div>
                <span>Maintenance</span>
            </a>
            <a href="analytics.html" class="menu-item">
                <div class="menu-icon">📈</div>
                <span>Analytics</span>
            </a>
            <a href="alerts.html" class="menu-item">
                <div class="menu-icon">⚠️</div>
                <span>Alerts</span>
            </a>
            <a href="notifications.html" class="menu-item active">
                <div class="menu-icon">🔔</div>
                <span>Notifications</span>
                <span class="notification-badge">5</span>
            </a>
            <a href="settings.html" class="menu-item">
                <div class="menu-icon">⚙️</div>
                <span>Settings</span>
            </a>
        </div>

        <!-- Main Content -->
        <div class="content">
            <div class="page-header-actions">
                <div class="page-title">🔔 Notifications</div>
                <button class="header-btn" onclick="markAllAsRead()">Mark all as read</button>
            </div>

    <div class="container">
        <!-- Toolbar -->
        <div class="toolbar">
            <input type="checkbox" class="checkbox" id="select-all" onchange="toggleSelectAll()">
            <button class="toolbar-btn" id="delete-btn" onclick="deleteSelected()" disabled>
                🗑️ Delete
            </button>
            <button class="toolbar-btn" id="archive-btn" onclick="archiveSelected()" disabled>
                📦 Archive
            </button>
            <button class="toolbar-btn" id="mark-read-btn" onclick="markSelectedAsRead()" disabled>
                ✓ Mark as read
            </button>
            <div class="toolbar-divider"></div>
            <input type="text" class="search-box" placeholder="Search notifications..." oninput="searchNotifications(event)">
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('all')">All</button>
            <button class="tab" onclick="switchTab('unread')">Unread</button>
            <button class="tab" onclick="switchTab('archived')">Archived</button>
        </div>

        <!-- Notification List -->
        <div class="notification-list" id="notification-list">
            <!-- Notifications will be inserted here -->
        </div>
    </div>
        </div>
    </div>

    <script>
        let notifications = [];
        let selectedNotifications = new Set();
        let currentTab = 'all';
        const currentUserId = 'admin-1';

        function renderNotifications() {
            const listContainer = document.getElementById('notification-list');
            const filtered = notifications.filter(n => {
                if (currentTab === 'unread') return !n.read && !n.archived;
                if (currentTab === 'archived') return n.archived;
                return !n.archived;
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <div class="empty-title">No notifications</div>
                        <div class="empty-message">You're all caught up!</div>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = filtered.map(n => `
                <div class="notification-item ${n.read ? '' : 'unread'} ${selectedNotifications.has(n.id) ? 'selected' : ''}" 
                     onclick="toggleNotification(${n.id})">
                    <input type="checkbox" class="checkbox" ${selectedNotifications.has(n.id) ? 'checked' : ''} 
                           onclick="event.stopPropagation(); toggleNotification(${n.id})">
                    <div class="notification-icon icon-${n.type}">${n.icon}</div>
                    <div class="notification-content">
                        <div class="notification-header">
                            <div class="notification-title">${n.title}</div>
                            <div class="notification-time">${n.time}</div>
                        </div>
                        <div class="notification-message">${n.message}</div>
                        <div class="notification-actions">
                            <span class="action-link" onclick="event.stopPropagation(); viewDetails(${n.id})">View Details</span>
                            ${!n.read ? `<span class="action-link" onclick="event.stopPropagation(); markAsRead(${n.id})">Mark as read</span>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');

            updateToolbarButtons();
        }

        function toggleNotification(id) {
            if (selectedNotifications.has(id)) {
                selectedNotifications.delete(id);
            } else {
                selectedNotifications.add(id);
            }
            renderNotifications();
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('select-all');
            const filtered = notifications.filter(n => {
                if (currentTab === 'unread') return !n.read && !n.archived;
                if (currentTab === 'archived') return n.archived;
                return !n.archived;
            });

            if (selectAll.checked) {
                filtered.forEach(n => selectedNotifications.add(n.id));
            } else {
                selectedNotifications.clear();
            }
            renderNotifications();
        }

        function updateToolbarButtons() {
            const hasSelection = selectedNotifications.size > 0;
            document.getElementById('delete-btn').disabled = !hasSelection;
            document.getElementById('archive-btn').disabled = !hasSelection;
            document.getElementById('mark-read-btn').disabled = !hasSelection;
        }

        function viewDetails(id) {
            const notification = notifications.find(n => n.id === id);
            if (notification) {
                alert(`Notification Details\n\nTitle: ${notification.title}\nMessage: ${notification.message}\nTime: ${notification.time}`);
                markAsRead(id);
            }
        }

        function searchNotifications(event) {
            const query = event.target.value.toLowerCase();
            const items = document.querySelectorAll('.notification-item');
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';
            });
        }

        async function loadNotifications() {
            try {
                const filter = currentTab === 'all' ? 'all' : currentTab === 'unread' ? 'unread' : 'archived';
                const response = await fetch(`/api/notifications?user_id=${currentUserId}&filter=${filter}`);
                const data = await response.json();
                
                if (data.notifications) {
                    notifications = data.notifications.map(n => ({
                        id: n.id,
                        type: n.type,
                        icon: n.icon,
                        title: n.title,
                        message: n.message,
                        time: formatTimeAgo(n.timestamp),
                        timestamp: n.timestamp * 1000,
                        read: n.read,
                        archived: n.archived
                    }));
                }
                
                renderNotifications();
            } catch (error) {
                console.error('Error loading notifications:', error);
                renderNotifications();
            }
        }

        function formatTimeAgo(timestamp) {
            const date = new Date(timestamp * 1000);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            
            if (seconds < 60) return 'just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + ' minutes ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + ' hours ago';
            return Math.floor(seconds / 86400) + ' days ago';
        }

        async function deleteSelected() {
            if (confirm(`Delete ${selectedNotifications.size} notification(s)?`)) {
                try {
                    await fetch('/api/notifications/action', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'delete',
                            ids: Array.from(selectedNotifications),
                            user_id: currentUserId
                        })
                    });
                    
                    selectedNotifications.clear();
                    document.getElementById('select-all').checked = false;
                    await loadNotifications();
                } catch (error) {
                    console.error('Error deleting notifications:', error);
                    alert('Failed to delete notifications');
                }
            }
        }

        async function archiveSelected() {
            try {
                await fetch('/api/notifications/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'archive',
                        ids: Array.from(selectedNotifications),
                        user_id: currentUserId
                    })
                });
                
                selectedNotifications.clear();
                document.getElementById('select-all').checked = false;
                await loadNotifications();
            } catch (error) {
                console.error('Error archiving notifications:', error);
                alert('Failed to archive notifications');
            }
        }

        async function markSelectedAsRead() {
            try {
                await fetch('/api/notifications/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'mark_read',
                        ids: Array.from(selectedNotifications),
                        user_id: currentUserId
                    })
                });
                
                selectedNotifications.clear();
                document.getElementById('select-all').checked = false;
                await loadNotifications();
            } catch (error) {
                console.error('Error marking as read:', error);
                alert('Failed to mark as read');
            }
        }

        async function markAsRead(id) {
            try {
                await fetch('/api/notifications/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'mark_read',
                        ids: [id],
                        user_id: currentUserId
                    })
                });
                
                await loadNotifications();
            } catch (error) {
                console.error('Error marking as read:', error);
            }
        }

        async function markAllAsRead() {
            try {
                await fetch('/api/notifications/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'mark_all_read',
                        ids: [],
                        user_id: currentUserId
                    })
                });
                
                await loadNotifications();
            } catch (error) {
                console.error('Error marking all as read:', error);
                alert('Failed to mark all as read');
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            selectedNotifications.clear();
            document.getElementById('select-all').checked = false;
            loadNotifications();
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadNotifications();
            
            // Refresh notifications every 30 seconds
            setInterval(loadNotifications, 30000);
        });

        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('sentinel_session');
                window.location.href = '../index.html';
            }
        }

        // Profile function
        function openProfile() {
            window.location.href = 'settings.html';
        }
    </script>
</body>
</html>
