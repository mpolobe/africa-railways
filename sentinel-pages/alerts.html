<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - Sentinel Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #1877f2; --dark: #18191a; --surface: #242526; --hover: #3a3b3c; --border: #3e4042; --text-primary: #e4e6eb; --text-secondary: #b0b3b8; --gold: #FFB800; --success: #00d084; --danger: #f02849; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--dark); color: var(--text-primary); min-height: 100vh; }
        .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 24px; font-weight: bold; color: var(--gold); }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            animation: glow 2s ease-in-out infinite;
            filter: drop-shadow(0 0 8px rgba(255, 184, 0, 0.6));
        }

        @keyframes glow {
            0%, 100% {
                filter: drop-shadow(0 0 8px rgba(255, 184, 0, 0.6));
            }
            50% {
                filter: drop-shadow(0 0 16px rgba(255, 184, 0, 0.9)) drop-shadow(0 0 24px rgba(255, 184, 0, 0.5));
            }
        }
        .main-container { display: grid; grid-template-columns: 280px 1fr; gap: 20px; padding: 20px; }
        .sidebar-left { position: sticky; top: 80px; height: fit-content; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 8px; color: var(--text-primary); text-decoration: none; transition: background 0.2s; }
        .menu-item:hover { background: var(--hover); }
        .menu-item.active { background: var(--hover); font-weight: 600; }
        .menu-icon { font-size: 20px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: var(--hover); border-radius: 50%; }
        .page-title { font-size: 28px; font-weight: bold; margin-bottom: 24px; }
        .card { background: var(--surface); border-radius: 8px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
        .alert-item { padding: 16px; background: var(--hover); border-radius: 8px; margin-bottom: 12px; border-left: 4px solid; }
        .alert-critical { border-left-color: var(--danger); }
        .alert-warning { border-left-color: #FFA500; }
        .alert-info { border-left-color: var(--primary); }
        @media (max-width: 768px) { .main-container { grid-template-columns: 1fr; } .sidebar-left { display: none; } }
    </style>
</head>
<body>
        <div class="header">
        <div class="header-left">
            <div class="logo"><img src="https://fuchsia-written-horse-361.mypinata.cloud/ipfs/bafkreihazljw6e4axcfro62q4l65cy6xukenisy2h7t2aws7iyop3lebcm" alt="Sentinel Logo" class="logo-img">🛡️ Sentinel Dashboard</div>
            <input type="text" class="search-bar" placeholder="Search..." style="width: 200px;">
        </div>
        <div class="header-right">
            <div class="live-indicator">
                <div class="live-dot"></div>
                LIVE
            </div>
            <button class="icon-btn" title="Notifications">
                🔔
                <span class="badge">3</span>
            </button>
            <button class="icon-btn" onclick="window.location.href='settings.html'" title="Settings">
                ⚙️
            </button>
            <button class="icon-btn" title="Profile">
                👤
            </button>
            <button class="icon-btn" onclick="logout()" title="Logout" style="background: #f02849;">
                🚪
            </button>
        </div>
    </div></div>
    <div class="main-container">
        <div class="sidebar-left">
            <a href="../sentinel-dashboard.html" class="menu-item"><div class="menu-icon">📊</div><span>Dashboard</span></a>
            <a href="bookings.html" class="menu-item"><div class="menu-icon">🎫</div><span>Bookings</span></a>
            <a href="payments.html" class="menu-item"><div class="menu-icon">💰</div><span>Payments</span></a>
            <a href="users.html" class="menu-item"><div class="menu-icon">👥</div><span>Users</span></a>
            <a href="routes.html" class="menu-item"><div class="menu-icon">🚂</div><span>Routes</span></a>
            <a href="analytics.html" class="menu-item"><div class="menu-icon">📈</div><span>Analytics</span></a>
            <a href="alerts.html" class="menu-item active"><div class="menu-icon">⚠️</div><span>Alerts</span></a>
            <a href="settings.html" class="menu-item"><div class="menu-icon">🔧</div><span>Settings</span></a>
        </div>
        <div class="content">
            <div class="page-title">⚠️ System Alerts</div>
            <div class="card">
                <h3 style="margin-bottom: 16px;">Active Alerts (5)</h3>
                <div id="alerts-list"></div>
            </div>
        </div>
    </div>
    <script>
        const alerts = [
            { type: 'critical', title: 'Track Maintenance Required', message: 'Section 45-B requires immediate attention', time: '5 minutes ago' },
            { type: 'warning', title: 'High Traffic Volume', message: 'Lusaka-Nairobi route experiencing high demand', time: '15 minutes ago' },
            { type: 'info', title: 'System Update Available', message: 'New features ready for deployment', time: '1 hour ago' },
            { type: 'warning', title: 'Payment Gateway Slow', message: 'Response times above threshold', time: '2 hours ago' },
            { type: 'info', title: 'New Sentinel Online', message: 'Elizabeth Phiri joined the network', time: '3 hours ago' },
        ];
        document.getElementById('alerts-list').innerHTML = alerts.map(a => `
            <div class="alert-item alert-${a.type}">
                <div style="font-weight: 600; margin-bottom: 4px;">${a.title}</div>
                <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 8px;">${a.message}</div>
                <div style="font-size: 12px; color: var(--text-secondary);">${a.time}</div>
            </div>
        `).join('');
    </script>
    <script>
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('sentinel_session');
                window.location.href = '../index.html';
            }
        }
    </script>
</body>
</html>
