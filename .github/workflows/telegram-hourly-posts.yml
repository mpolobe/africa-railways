      - name: Send Message 7 - FAQ
        if: steps.check-ido.outputs.skip != 'true' && steps.message.outputs.index == '7'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "@afrcsentinel",
              "text": "❓ *QUICK FAQ*\n\n*What is SENT?*\nThe investment token for Africa Railways infrastructure.\n\n*Price?*\n$0.00005 per SENT\n\n*Network?*\nPolygon (need MATIC to participate)\n\n*When does IDO end?*\nJanuary 26, 2026 at 14:00 UTC\n\n*Is liquidity locked?*\nYes! 730 days (2 years)\n\n*Contract:*\n`0xF379f21Af5967F26c358568Bb60408DB8B4F7fE5`\n\n👉 https://www.pinksale.finance/launchpad/polygon/0xf366e3aaCC54C99E50c90B7C57625776f88D8d08",
              "parse_mode": "Markdown"
            }'

      - name: Log completion
        if: steps.check-ido.outputs.skip != 'true'
        run: |
          echo "✅ Posted message ${{ steps.message.outputs.index }} at $(date -u)"
