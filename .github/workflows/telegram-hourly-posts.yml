      - name: Send Message 5 - Tokenomics
        if: steps.check-ido.outputs.skip != 'true' && steps.message.outputs.index == '5'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "@afrcsentinel",
              "text": "📊 *SENT TOKENOMICS*\n\n*Total Supply:* 10,000,000,000 SENT\n\n*Distribution:*\n🟡 45% - Community & Sentinels\n🟢 20% - Public Sale (IDO)\n🔵 20% - Ecosystem Fund\n🟣 8% - Core Tech Staff\n🟠 5% - Strategic Partners\n⚪ 2% - Reserve\n\n*IDO Details:*\n• Price: $0.00005\n• SoftCap: 255,000 MATIC\n• Liquidity Lock: 730 days\n\n👉 https://www.pinksale.finance/launchpad/polygon/0xf366e3aaCC54C99E50c90B7C57625776f88D8d08",
              "parse_mode": "Markdown"
            }'

      - name: Send Message 6 - Roadmap
        if: steps.check-ido.outputs.skip != 'true' && steps.message.outputs.index == '6'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "@afrcsentinel",
              "text": "🗺️ *AFRICA RAILWAYS ROADMAP*\n\n*Q1 2026*\n✅ SENT Token IDO\n⬜ DEX listing\n⬜ CoinGecko listing\n\n*Q2 2026*\n⬜ Sentinel node network launch\n⬜ 500 signaling nodes deployed\n⬜ Staking platform\n\n*Q3 2026*\n⬜ African rail partnerships\n⬜ 2,000 nodes operational\n⬜ Governance DAO\n\n*Q4 2026*\n⬜ Pan-African integration\n⬜ Major exchange listings\n\n🚂 Building the future of African transportation!\n\n👉 https://www.pinksale.finance/launchpad/polygon/0xf366e3aaCC54C99E50c90B7C57625776f88D8d08",
              "parse_mode": "Markdown"
